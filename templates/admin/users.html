<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>User Management</h1>
            <p class="text-muted mb-0">
                Manage system users and their roles.
            </p>
        </div>

        <a href="/dashboard/" class="btn btn-secondary">
            Back to Dashboard
        </a>
    </div>

    <div id="message"></div>

    <!-- Create User -->

    <div class="card mb-4">

        <div class="card-header">
            <h5 class="mb-0">Create User</h5>
        </div>

        <div class="card-body">

            <form id="createUserForm">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Role
                        </label>

                        <select id="role" class="form-select" required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="Inspector">
                                Inspector
                            </option>

                            <option value="Team Lead">
                                Team Lead
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                        </select>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select id="is_active" class="form-select">

                            <option value="true">
                                Active
                            </option>

                            <option value="false">
                                Disabled
                            </option>

                        </select>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create User
                </button>

            </form>

        </div>

    </div>


    <!-- Users -->

    <div class="card">

        <div class="card-header">
            <h5 class="mb-0">
                System Users
            </h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="usersTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "/api/auth/users/";


// Get JWT access token
function getAccessToken() {

    return localStorage.getItem("access_token");

}


// Display message
function showMessage(message, type = "success") {

    const messageBox = document.getElementById("message");

    messageBox.innerHTML = `
        <div class="alert alert-${type}">
            ${message}
        </div>
    `;

}


// Load users
async function loadUsers() {

    const token = getAccessToken();

    if (!token) {

        showMessage(
            "Authentication token not found.",
            "danger"
        );

        return;
    }

    try {

        const response = await fetch(
            API_URL,
            {
                method: "GET",

                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {

            throw new Error(
                "Unable to load users."
            );

        }

        const users = await response.json();

        const tableBody =
            document.getElementById(
                "usersTableBody"
            );

        tableBody.innerHTML = "";

        users.forEach(user => {

            const statusBadge = user.is_active
                ? `<span class="badge bg-success">Active</span>`
                : `<span class="badge bg-danger">Disabled</span>`;

            tableBody.innerHTML += `

                <tr>

                    <td>${user.id}</td>

                    <td>${user.username}</td>

                    <td>${user.email}</td>

                    <td>

                        <select
                            class="form-select form-select-sm"
                            id="role-${user.id}"
                        >

                            <option
                                value="Inspector"
                                ${user.role === "Inspector" ? "selected" : ""}
                            >
                                Inspector
                            </option>

                            <option
                                value="Team Lead"
                                ${user.role === "Team Lead" ? "selected" : ""}
                            >
                                Team Lead
                            </option>

                            <option
                                value="Admin"
                                ${user.role === "Admin" ? "selected" : ""}
                            >
                                Admin
                            </option>

                        </select>

                    </td>

                    <td>
                        ${statusBadge}
                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-primary mb-1"
                            onclick="updateRole(${user.id})"
                        >
                            Save Role
                        </button>

                        <button
                            class="btn btn-sm ${
                                user.is_active
                                    ? "btn-warning"
                                    : "btn-success"
                            }"
                            onclick="toggleUser(
                                ${user.id},
                                ${user.is_active}
                            )"
                        >
                            ${
                                user.is_active
                                    ? "Disable"
                                    : "Enable"
                            }
                        </button>

                    </td>

                </tr>

            `;

        });

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


// Create user
document
    .getElementById("createUserForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const token = getAccessToken();

            const data = {

                username:
                    document.getElementById(
                        "username"
                    ).value,

                email:
                    document.getElementById(
                        "email"
                    ).value,

                password:
                    document.getElementById(
                        "password"
                    ).value,

                role:
                    document.getElementById(
                        "role"
                    ).value,

                is_active:
                    document.getElementById(
                        "is_active"
                    ).value === "true"

            };

            try {

                const response = await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`
                        },

                        body: JSON.stringify(data)
                    }
                );

                const result =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        JSON.stringify(result)
                    );

                }

                showMessage(
                    "User created successfully."
                );

                document
                    .getElementById(
                        "createUserForm"
                    )
                    .reset();

                loadUsers();

            } catch (error) {

                showMessage(
                    error.message,
                    "danger"
                );

            }

        }
    );


// Update role
async function updateRole(userId) {

    const token = getAccessToken();

    const role =
        document.getElementById(
            `role-${userId}`
        ).value;

    try {

        const response = await fetch(
            `${API_URL}${userId}/`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    role: role
                })
            }
        );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                JSON.stringify(result)
            );

        }

        showMessage(
            "User role updated successfully."
        );

        loadUsers();

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


// Enable / Disable user
async function toggleUser(
    userId,
    currentlyActive
) {

    const token = getAccessToken();

    try {

        const response = await fetch(
            `${API_URL}${userId}/`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    is_active:
                        !currentlyActive
                })
            }
        );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                JSON.stringify(result)
            );

        }

        showMessage(
            currentlyActive
                ? "User disabled successfully."
                : "User enabled successfully."
        );

        loadUsers();

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


// Initial load
loadUsers();

</script>

</body>
</html>
