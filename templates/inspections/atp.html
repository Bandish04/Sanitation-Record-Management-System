<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATP Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div class="container py-5">


    <!-- ================================================== -->
    <!-- HEADER -->
    <!-- ================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                ATP Reports
            </h2>

            <p class="text-muted mb-0">
                View historical UltraSnap ATP reports.
            </p>

        </div>


        <a
            href="/dashboard/"
            class="btn btn-secondary"
        >
            Dashboard
        </a>

    </div>


    <!-- ================================================== -->
    <!-- MESSAGE -->
    <!-- ================================================== -->

    <div
        id="message"
        class="alert d-none"
        role="alert"
    ></div>


    <!-- ================================================== -->
    <!-- ADMIN UPLOAD SECTION -->
    <!-- ================================================== -->

    <div
        id="uploadSection"
        class="card shadow mb-4 d-none"
    >

        <div class="card-header">

            <h5 class="mb-0">
                Upload ATP Report
            </h5>

        </div>


        <div class="card-body">

            <form id="uploadForm">

                <!-- ====================================== -->
                <!-- PLANT -->
                <!-- ====================================== -->

                <div class="mb-3">

                    <label
                        for="plant"
                        class="form-label"
                    >
                        Plant
                    </label>


                    <select
                        id="plant"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Plant
                        </option>

                    </select>

                </div>


                <!-- ====================================== -->
                <!-- INSPECTION -->
                <!-- ====================================== -->

                <div class="mb-3">

                    <label
                        for="inspection"
                        class="form-label"
                    >
                        Inspection
                        <span class="text-muted">
                            (Optional)
                        </span>
                    </label>


                    <select
                        id="inspection"
                        class="form-select"
                    >

                        <option value="">
                            No inspection
                        </option>

                    </select>

                </div>


                <!-- ====================================== -->
                <!-- FILE -->
                <!-- ====================================== -->

                <div class="mb-3">

                    <label
                        for="file"
                        class="form-label"
                    >
                        ATP Report File
                    </label>


                    <input
                        type="file"
                        id="file"
                        class="form-control"
                        accept=".pdf,.jpg,.jpeg,.png,.webp"
                        required
                    >


                    <div class="form-text">

                        Allowed:
                        PDF, JPG, JPEG, PNG, WEBP.

                        Maximum size:
                        10 MB.

                    </div>

                </div>


                <!-- ====================================== -->
                <!-- NOTES -->
                <!-- ====================================== -->

                <div class="mb-3">

                    <label
                        for="notes"
                        class="form-label"
                    >
                        Notes
                    </label>


                    <textarea
                        id="notes"
                        class="form-control"
                        rows="3"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    id="uploadButton"
                    class="btn btn-primary"
                >
                    Upload ATP Report
                </button>

            </form>

        </div>

    </div>


    <!-- ================================================== -->
    <!-- REPORT LIST -->
    <!-- ================================================== -->

    <div class="card shadow">

        <div class="card-header">

            <h5 class="mb-0">
                Previous ATP Reports
            </h5>

        </div>


        <div class="card-body">


            <div
                id="loading"
                class="text-center"
            >
                Loading reports...
            </div>


            <div
                id="emptyMessage"
                class="alert alert-info d-none"
            >
                No ATP reports found.
            </div>


            <div
                class="table-responsive d-none"
                id="tableContainer"
            >

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-light">

                        <tr>

                            <!-- ID is only displayed to Admin -->

                            <th
                                id="idHeader"
                                class="d-none"
                            >
                                ID
                            </th>


                            <th>
                                Plant
                            </th>


                            <th>
                                Inspection
                            </th>


                            <th>
                                File
                            </th>


                            <th>
                                Uploaded By
                            </th>


                            <th>
                                Uploaded At
                            </th>


                            <th>
                                Status
                            </th>


                            <th>
                                Notes
                            </th>

                        </tr>

                    </thead>


                    <tbody id="reportsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>


// ============================================================
// ACCESS TOKEN
// ============================================================

const token =
    localStorage.getItem(
        "access_token"
    );


if (!token) {

    window.location.href =
        "/login/";

}


// ============================================================
// PAGE ELEMENTS
// ============================================================

const plantSelect =
    document.getElementById(
        "plant"
    );


const inspectionSelect =
    document.getElementById(
        "inspection"
    );


const uploadSection =
    document.getElementById(
        "uploadSection"
    );


const uploadForm =
    document.getElementById(
        "uploadForm"
    );


const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const message =
    document.getElementById(
        "message"
    );


const reportsTableBody =
    document.getElementById(
        "reportsTableBody"
    );


const loading =
    document.getElementById(
        "loading"
    );


const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );


const tableContainer =
    document.getElementById(
        "tableContainer"
    );


const idHeader =
    document.getElementById(
        "idHeader"
    );


// ============================================================
// USER ROLE
// ============================================================

let isAdmin = false;


// ============================================================
// SHOW MESSAGE
// ============================================================

function showMessage(
    text,
    type = "success"
) {

    message.textContent =
        text;

    message.className =
        `alert alert-${type}`;

}


// ============================================================
// HIDE MESSAGE
// ============================================================

function hideMessage() {

    message.classList.add(
        "d-none"
    );

}


// ============================================================
// GET LIST
// ============================================================

function getList(data) {

    if (Array.isArray(data)) {

        return data;

    }


    if (
        data &&
        Array.isArray(data.results)
    ) {

        return data.results;

    }


    return [];

}


// ============================================================
// LOAD CURRENT USER
// ============================================================

async function loadCurrentUser() {

    try {

        const response =
            await fetch(
                "/api/auth/me/",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to load user information."
            );

        }


        /*
         * Your /api/auth/me/ response contains
         * the user's group/role information.
         *
         * Check several possible field names
         * so the page remains compatible with
         * the existing API response.
         */

        const groups =
            data.groups ||
            data.group_names ||
            data.roles ||
            [];


        if (Array.isArray(groups)) {

            isAdmin =
                groups.some(
                    function(group) {

                        const groupName =
                            typeof group === "string"
                                ? group
                                : group.name;

                        return groupName === "Admin";

                    }
                );

        }


        /*
         * Some versions of the API may return
         * a direct role field.
         */

        if (
            data.role === "Admin" ||
            data.group === "Admin"
        ) {

            isAdmin = true;

        }


        /*
         * Only Admin gets the upload section.
         */

        if (isAdmin) {

            uploadSection.classList.remove(
                "d-none"
            );

            idHeader.classList.remove(
                "d-none"
            );

        }

    }
    catch (error) {

        console.error(
            "User loading error:",
            error
        );

        /*
         * Fail closed.
         *
         * If we cannot determine the role,
         * do NOT show the upload section.
         */

        isAdmin = false;

        uploadSection.classList.add(
            "d-none"
        );

        idHeader.classList.add(
            "d-none"
        );

    }

}


// ============================================================
// LOAD PLANTS
// ============================================================

async function loadPlants() {

    /*
     * Plants are only required for the Admin
     * upload form.
     */

    if (!isAdmin) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/plants/",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load plants."
            );

        }


        const data =
            await response.json();


        const plants =
            getList(data);


        plantSelect.innerHTML =
            `
                <option value="">
                    Select Plant
                </option>
            `;


        plants.forEach(
            function(plant) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    plant.id;


                option.textContent =
                    `${plant.code} - ${plant.name}`;


                plantSelect.appendChild(
                    option
                );

            }
        );

    }
    catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


// ============================================================
// LOAD INSPECTIONS
// ============================================================

async function loadInspections() {

    /*
     * Only Admin needs the inspection dropdown
     * because only Admin can upload ATP reports.
     */

    if (!isAdmin) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/inspections/",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load inspections."
            );

        }


        const data =
            await response.json();


        const inspections =
            getList(data);


        inspectionSelect.innerHTML =
            `
                <option value="">
                    No inspection
                </option>
            `;


        inspections.forEach(
            function(inspection) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    inspection.id;


                /*
                 * Display names instead of numeric
                 * Plant and Template/Inspection IDs.
                 */

                const plantName =
                    inspection.plant_name ||
                    inspection.plant_code ||
                    "Unknown Plant";


                const inspectorName =
                    inspection.inspector_username ||
                    inspection.inspector_name ||
                    inspection.inspector ||
                    "Unknown Inspector";


                option.textContent =
                    `${plantName} - ${inspectorName} - ${inspection.inspection_date} - ${inspection.status}`;


                inspectionSelect.appendChild(
                    option
                );

            }
        );

    }
    catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


// ============================================================
// LOAD ATP REPORTS
// ============================================================

async function loadReports() {

    loading.classList.remove(
        "d-none"
    );


    tableContainer.classList.add(
        "d-none"
    );


    emptyMessage.classList.add(
        "d-none"
    );


    try {

        const response =
            await fetch(
                "/api/inspections/atp/",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load ATP reports."
            );

        }


        const data =
            await response.json();


        const reports =
            getList(data);


        reportsTableBody.innerHTML =
            "";


        if (reports.length === 0) {

            emptyMessage.classList.remove(
                "d-none"
            );

            return;

        }


        reports.forEach(
            function(report) {

                const row =
                    document.createElement(
                        "tr"
                    );


                // ==========================================
                // FILE LINK
                // ==========================================

                const fileLink =
                    document.createElement(
                        "a"
                    );


                fileLink.href =
                    report.file;


                fileLink.target =
                    "_blank";


                fileLink.rel =
                    "noopener noreferrer";


                fileLink.textContent =
                    report.original_filename ||
                    "View File";


                const fileCell =
                    document.createElement(
                        "td"
                    );


                fileCell.appendChild(
                    fileLink
                );


                // ==========================================
                // PLANT NAME
                // ==========================================

                const plantName =
                    report.plant_name ||
                    report.plant_code ||
                    (
                        typeof report.plant === "string"
                            ? report.plant
                            : "-"
                    );


                // ==========================================
                // INSPECTION NAME
                // ==========================================

                const inspectionName =
                    report.inspection_inspector ||
                    report.inspector_name ||
                    report.inspector_username ||
                    (
                        typeof report.inspection === "string"
                            ? report.inspection
                            : "-"
                    );


                // ==========================================
                // ROW
                // ==========================================

                row.innerHTML = `

                    ${
                        isAdmin
                            ? `
                                <td>
                                    ${report.id ?? "-"}
                                </td>
                              `
                            : ""
                    }


                    <td>
                        ${plantName}
                    </td>


                    <td>
                        ${inspectionName}
                    </td>


                    <td></td>


                    <td>
                        ${report.uploaded_by_username ||
                          report.uploaded_by ||
                          "-"}
                    </td>


                    <td>
                        ${formatDate(
                            report.uploaded_at
                        )}
                    </td>


                    <td>

                        <span class="badge bg-success">

                            ${report.status || "-"}

                        </span>

                    </td>


                    <td>
                        ${report.notes || ""}
                    </td>

                `;


                /*
                 * File link goes into the correct
                 * file column.
                 */

                const fileColumnIndex =
                    isAdmin ? 3 : 2;


                row.children[
                    fileColumnIndex
                ].appendChild(
                    fileLink
                );


                reportsTableBody.appendChild(
                    row
                );

            }
        );


        tableContainer.classList.remove(
            "d-none"
        );

    }
    catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }
    finally {

        loading.classList.add(
            "d-none"
        );

    }

}


// ============================================================
// FORMAT DATE
// ============================================================

function formatDate(
    dateString
) {

    if (!dateString) {

        return "-";

    }


    return new Date(
        dateString
    ).toLocaleString();

}


// ============================================================
// UPLOAD ATP REPORT
// ============================================================

uploadForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /*
         * Extra frontend security.
         *
         * Even though the upload section is hidden
         * for non-admin users, do not allow the
         * JavaScript upload function to execute.
         */

        if (!isAdmin) {

            showMessage(
                "Only Admin users can upload ATP reports.",
                "danger"
            );

            return;

        }


        hideMessage();


        const plant =
            plantSelect.value;


        const inspection =
            inspectionSelect.value;


        const file =
            document.getElementById(
                "file"
            ).files[0];


        const notes =
            document.getElementById(
                "notes"
            ).value;


        if (!plant) {

            showMessage(
                "Please select a plant.",
                "danger"
            );

            return;

        }


        if (!file) {

            showMessage(
                "Please select a file.",
                "danger"
            );

            return;

        }


        const maxSize =
            10 * 1024 * 1024;


        if (file.size > maxSize) {

            showMessage(
                "File size cannot exceed 10 MB.",
                "danger"
            );

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "plant",
            plant
        );


        if (inspection) {

            formData.append(
                "inspection",
                inspection
            );

        }


        formData.append(
            "file",
            file
        );


        formData.append(
            "notes",
            notes
        );


        uploadButton.disabled =
            true;


        uploadButton.textContent =
            "Uploading...";


        try {

            const response =
                await fetch(
                    "/api/inspections/atp/",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        },

                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                let errorText =
                    "Unable to upload ATP report.";


                if (data.detail) {

                    errorText =
                        data.detail;

                }


                if (data.file) {

                    errorText =
                        data.file.join(" ");

                }


                showMessage(
                    errorText,
                    "danger"
                );

                return;

            }


            showMessage(
                "ATP report uploaded successfully.",
                "success"
            );


            uploadForm.reset();


            await loadReports();

        }
        catch (error) {

            console.error(
                "ATP upload error:",
                error
            );


            showMessage(
                "Unable to connect to the server.",
                "danger"
            );

        }
        finally {

            uploadButton.disabled =
                false;


            uploadButton.textContent =
                "Upload ATP Report";

        }

    }
);


// ============================================================
// INITIALIZE
// ============================================================

async function initialize() {

    /*
     * First determine the user's role.
     */

    await loadCurrentUser();


    /*
     * Only Admin needs these two endpoints
     * for uploading.
     */

    await loadPlants();

    await loadInspections();


    /*
     * Everyone can view historical reports.
     */

    await loadReports();

}


initialize();

</script>


</body>

</html>
