<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATP Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>ATP Reports</h2>

            <p class="text-muted mb-0">
                View and upload UltraSnap ATP reports.
            </p>
        </div>

        <a
            href="/dashboard/"
            class="btn btn-secondary"
        >
            Dashboard
        </a>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="alert d-none"
    ></div>


    <!-- UPLOAD SECTION -->

    <div
        id="uploadSection"
        class="card shadow mb-4"
    >

        <div class="card-header">

            <h5 class="mb-0">
                Upload ATP Report
            </h5>

        </div>


        <div class="card-body">

            <form id="uploadForm">

                <!-- PLANT -->

                <div class="mb-3">

                    <label
                        for="plant"
                        class="form-label"
                    >
                        Plant
                    </label>

                    <select
                        id="plant"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Plant
                        </option>

                    </select>

                </div>


                <!-- INSPECTION -->

                <div class="mb-3">

                    <label
                        for="inspection"
                        class="form-label"
                    >
                        Inspection
                        <span class="text-muted">
                            (Optional)
                        </span>
                    </label>

                    <select
                        id="inspection"
                        class="form-select"
                    >

                        <option value="">
                            No inspection
                        </option>

                    </select>

                </div>


                <!-- FILE -->

                <div class="mb-3">

                    <label
                        for="file"
                        class="form-label"
                    >
                        ATP Report File
                    </label>

                    <input
                        type="file"
                        id="file"
                        class="form-control"
                        accept=".pdf,.jpg,.jpeg,.png,.webp"
                        required
                    >

                    <div class="form-text">
                        Allowed: PDF, JPG, JPEG, PNG, WEBP.
                        Maximum size: 10 MB.
                    </div>

                </div>


                <!-- NOTES -->

                <div class="mb-3">

                    <label
                        for="notes"
                        class="form-label"
                    >
                        Notes
                    </label>

                    <textarea
                        id="notes"
                        class="form-control"
                        rows="3"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    id="uploadButton"
                    class="btn btn-primary"
                >
                    Upload ATP Report
                </button>

            </form>

        </div>

    </div>


    <!-- REPORT LIST -->

    <div class="card shadow">

        <div class="card-header">

            <h5 class="mb-0">
                ATP Reports
            </h5>

        </div>


        <div class="card-body">

            <div
                id="loading"
                class="text-center"
            >
                Loading reports...
            </div>


            <div
                id="emptyMessage"
                class="alert alert-info d-none"
            >
                No ATP reports found.
            </div>


            <div
                class="table-responsive"
                id="tableContainer"
            >

                <table class="table table-bordered table-hover">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Plant</th>

                            <th>Inspection</th>

                            <th>File</th>

                            <th>Uploaded By</th>

                            <th>Uploaded At</th>

                            <th>Status</th>

                            <th>Notes</th>

                        </tr>

                    </thead>


                    <tbody id="reportsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const token =
    localStorage.getItem("access_token");


const plantSelect =
    document.getElementById("plant");


const inspectionSelect =
    document.getElementById("inspection");


const uploadSection =
    document.getElementById("uploadSection");


const uploadForm =
    document.getElementById("uploadForm");


const uploadButton =
    document.getElementById("uploadButton");


const message =
    document.getElementById("message");


const reportsTableBody =
    document.getElementById(
        "reportsTableBody"
    );


const loading =
    document.getElementById("loading");


const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );


const tableContainer =
    document.getElementById(
        "tableContainer"
    );


if (!token) {

    window.location.href =
        "/login/";

}


function showMessage(
    text,
    type = "success"
) {

    message.textContent = text;

    message.className =
        `alert alert-${type}`;

}


function hideMessage() {

    message.classList.add(
        "d-none"
    );

}


/* ============================================================
   LOAD PLANTS
============================================================ */

async function loadPlants() {

    try {

        const response = await fetch(
            "/api/plants/",
            {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                "Unable to load plants."
            );

        }


        const plants =
            await response.json();


        plantSelect.innerHTML =
            `<option value="">
                Select Plant
            </option>`;


        plants.forEach(
            function(plant) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    plant.id;

                option.textContent =
                    `${plant.code} - ${plant.name}`;

                plantSelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ============================================================
   LOAD INSPECTIONS
============================================================ */

async function loadInspections() {

    try {

        const response = await fetch(
            "/api/inspections/",
            {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                "Unable to load inspections."
            );

        }


        const data =
            await response.json();


        const inspections =
            data.results || data;


        inspectionSelect.innerHTML =
            `<option value="">
                No inspection
            </option>`;


        inspections.forEach(
            function(inspection) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    inspection.id;

                option.textContent =
                    `Inspection #${inspection.id}
                     - Plant ${inspection.plant}
                     - ${inspection.inspection_date}
                     - ${inspection.status}`;

                inspectionSelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ============================================================
   LOAD ATP REPORTS
============================================================ */

async function loadReports() {

    loading.classList.remove(
        "d-none"
    );

    tableContainer.classList.add(
        "d-none"
    );

    emptyMessage.classList.add(
        "d-none"
    );


    try {

        const response = await fetch(
            "/api/inspections/atp/",
            {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                "Unable to load ATP reports."
            );

        }


        const data =
            await response.json();


        const reports =
            data.results || data;


        reportsTableBody.innerHTML =
            "";


        if (reports.length === 0) {

            emptyMessage.classList.remove(
                "d-none"
            );

            return;

        }


        reports.forEach(
            function(report) {

                const row =
                    document.createElement(
                        "tr"
                    );


                const fileLink =
                    document.createElement(
                        "a"
                    );

                fileLink.href =
                    report.file;

                fileLink.target =
                    "_blank";

                fileLink.textContent =
                    report.original_filename;


                const fileCell =
                    document.createElement(
                        "td"
                    );

                fileCell.appendChild(
                    fileLink
                );


                row.innerHTML = `
                    <td>${report.id}</td>

                    <td>
                        ${report.plant}
                    </td>

                    <td>
                        ${
                            report.inspection
                            || "-"
                        }
                    </td>

                    <td></td>

                    <td>
                        ${report.uploaded_by}
                    </td>

                    <td>
                        ${formatDate(
                            report.uploaded_at
                        )}
                    </td>

                    <td>
                        <span class="badge bg-success">
                            ${report.status}
                        </span>
                    </td>

                    <td>
                        ${report.notes || ""}
                    </td>
                `;


                row.children[3]
                    .appendChild(
                        fileLink
                    );


                reportsTableBody.appendChild(
                    row
                );

            }
        );


        tableContainer.classList.remove(
            "d-none"
        );


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );


    } finally {

        loading.classList.add(
            "d-none"
        );

    }

}


/* ============================================================
   FORMAT DATE
============================================================ */

function formatDate(
    dateString
) {

    if (!dateString) {
        return "-";
    }

    return new Date(
        dateString
    ).toLocaleString();

}


/* ============================================================
   PLANT CHANGE
============================================================ */

plantSelect.addEventListener(
    "change",
    function() {

        /*
         * The inspection dropdown is
         * intentionally kept simple here.
         *
         * The backend still validates
         * the selected inspection.
         */

    }
);


/* ============================================================
   UPLOAD
============================================================ */

uploadForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        const plant =
            plantSelect.value;

        const inspection =
            inspectionSelect.value;

        const file =
            document.getElementById(
                "file"
            ).files[0];

        const notes =
            document.getElementById(
                "notes"
            ).value;


        if (!plant) {

            showMessage(
                "Please select a plant.",
                "danger"
            );

            return;

        }


        if (!file) {

            showMessage(
                "Please select a file.",
                "danger"
            );

            return;

        }


        const maxSize =
            10 * 1024 * 1024;


        if (file.size > maxSize) {

            showMessage(
                "File size cannot exceed 10 MB.",
                "danger"
            );

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "plant",
            plant
        );


        if (inspection) {

            formData.append(
                "inspection",
                inspection
            );

        }


        formData.append(
            "file",
            file
        );


        formData.append(
            "notes",
            notes
        );


        uploadButton.disabled =
            true;

        uploadButton.textContent =
            "Uploading...";


        try {

            const response =
                await fetch(
                    "/api/inspections/atp/",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        },

                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                let errorText =
                    "Unable to upload ATP report.";


                if (data.detail) {

                    errorText =
                        data.detail;

                }


                if (data.file) {

                    errorText =
                        data.file.join(" ");

                }


                showMessage(
                    errorText,
                    "danger"
                );

                return;

            }


            showMessage(
                "ATP report uploaded successfully.",
                "success"
            );


            uploadForm.reset();


            await loadReports();


        } catch (error) {

            showMessage(
                "Unable to connect to the server.",
                "danger"
            );


        } finally {

            uploadButton.disabled =
                false;

            uploadButton.textContent =
                "Upload ATP Report";

        }

    }
);


/* ============================================================
   INITIAL LOAD
============================================================ */

async function initialize() {

    await loadPlants();

    await loadInspections();

    await loadReports();

}


initialize();

</script>

</body>

</html>
