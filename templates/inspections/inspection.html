<script>

const accessToken =
    localStorage.getItem("access_token");


const PLANTS_API =
    "/api/plants/";

const TEMPLATES_API =
    "/api/inspections/templates/";

const QUESTIONS_API =
    "/api/inspections/questions/";

const INSPECTIONS_API =
    "/api/inspections/";


let editingInspectionId = null;

let currentQuestions = [];

let existingAnswers = {};


/* ==================================================
   LOGIN CHECK
================================================== */

if (!accessToken) {

    window.location.href =
        "/login/";

}


/* ==================================================
   ELEMENTS
================================================== */

const plantSelect =
    document.getElementById("plant");

const templateSelect =
    document.getElementById("template");

const inspectionDate =
    document.getElementById(
        "inspection_date"
    );

const generalNotes =
    document.getElementById(
        "general_notes"
    );

const questionsContainer =
    document.getElementById(
        "questionsContainer"
    );

const saveDraftButton =
    document.getElementById(
        "saveDraftButton"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const inspectionTable =
    document.getElementById(
        "inspectionTable"
    );

const message =
    document.getElementById(
        "message"
    );


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text,
    type = "success"
) {

    message.textContent =
        text;

    message.className =
        `alert alert-${type}`;

}


/* ==================================================
   HEADERS
================================================== */

function getHeaders() {

    return {

        "Authorization":
            `Bearer ${accessToken}`,

        "Content-Type":
            "application/json"

    };

}


/* ==================================================
   LOAD PLANTS
================================================== */

async function loadPlants() {

    try {

        const response =
            await fetch(
                PLANTS_API,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load plants."
            );

        }


        const plants =
            await response.json();


        plantSelect.innerHTML =
            `
            <option value="">
                Select Plant
            </option>
            `;


        plants.forEach(
            plant => {

                if (!plant.active) {
                    return;
                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    plant.id;


                option.textContent =
                    `${plant.code} - ${plant.name}`;


                plantSelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   LOAD TEMPLATES
================================================== */

async function loadTemplates() {

    try {

        const response =
            await fetch(
                TEMPLATES_API,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load inspection templates."
            );

        }


        const templates =
            await response.json();


        templateSelect.innerHTML =
            `
            <option value="">
                Select Template
            </option>
            `;


        templates.forEach(
            template => {

                if (!template.active) {
                    return;
                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    template.id;


                option.textContent =
                    template.name;


                templateSelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   LOAD QUESTIONS
================================================== */

async function loadQuestions() {

    const templateId =
        templateSelect.value;


    if (!templateId) {

        questionsContainer.innerHTML = `

            <div class="alert alert-info">

                Select an inspection template
                to load questions.

            </div>

        `;

        return;

    }


    try {

        const response =
            await fetch(
                `${QUESTIONS_API}?template=${templateId}`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load inspection questions."
            );

        }


        const questions =
            await response.json();


        currentQuestions =
            questions.filter(
                question =>
                    question.active !== false
            );


        renderQuestions(
            currentQuestions
        );


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   RENDER QUESTIONS
================================================== */

function renderQuestions(
    questions
) {

    questionsContainer.innerHTML =
        "";


    if (questions.length === 0) {

        questionsContainer.innerHTML = `

            <div class="alert alert-warning">

                No active questions were found
                for this template.

            </div>

        `;

        return;

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card shadow";


    const body =
        document.createElement(
            "div"
        );


    body.className =
        "card-body";


    const heading =
        document.createElement(
            "h4"
        );


    heading.className =
        "mb-4";


    heading.textContent =
        "Inspection Questions";


    body.appendChild(
        heading
    );


    questions.forEach(
        (question, index) => {

            const questionCard =
                document.createElement(
                    "div"
                );


            questionCard.className =
                "border rounded p-3 mb-3";


            questionCard.innerHTML = `

                <div class="mb-3">

                    <strong>
                        ${index + 1}.
                        ${question.question_text}
                    </strong>

                </div>


                <div class="mb-3">

                    <div class="form-check form-check-inline">

                        <input
                            class="form-check-input answer-radio"
                            type="radio"
                            name="question_${question.id}"
                            value="YES"
                            data-question-id="${question.id}"
                            data-requires-observation="${question.requires_observation_on_no}"
                        >

                        <label class="form-check-label">
                            YES
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            class="form-check-input answer-radio"
                            type="radio"
                            name="question_${question.id}"
                            value="NO"
                            data-question-id="${question.id}"
                            data-requires-observation="${question.requires_observation_on_no}"
                        >

                        <label class="form-check-label">
                            NO
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            class="form-check-input answer-radio"
                            type="radio"
                            name="question_${question.id}"
                            value="NA"
                            data-question-id="${question.id}"
                            data-requires-observation="${question.requires_observation_on_no}"
                        >

                        <label class="form-check-label">
                            N/A
                        </label>

                    </div>

                </div>


                <div
                    id="observation_container_${question.id}"
                    class="d-none"
                >

                    <label
                        class="form-label"
                    >
                        Observation
                    </label>

                    <textarea
                        id="observation_${question.id}"
                        class="form-control"
                        rows="2"
                        placeholder="Enter observation..."
                    ></textarea>

```
            </div>

        `;


        body.appendChild(
            questionCard
        );

    }
);


card.appendChild(
    body
);


questionsContainer.appendChild(
    card
);


attachAnswerListeners();
```

}

/* ==================================================
ANSWER LISTENERS
================================================== */

function attachAnswerListeners() {

```
const radios =
    document.querySelectorAll(
        ".answer-radio"
    );


radios.forEach(
    radio => {

        radio.addEventListener(
            "change",
            function() {

                const questionId =
                    this.dataset.questionId;

                const requiresObservation =
                    this.dataset.requiresObservation ===
                    "true";


                const observationContainer =
                    document.getElementById(
                        `observation_container_${questionId}`
                    );


                if (
                    this.value === "NO" &&
                    requiresObservation
                ) {

                    observationContainer
                        .classList
                        .remove("d-none");

                } else {

                    observationContainer
                        .classList
                        .add("d-none");

                }

            }
        );

    }
);
```

}

/* ==================================================
TEMPLATE CHANGE
================================================== */

templateSelect.addEventListener(
"change",
async function() {

```
    existingAnswers = {};

    await loadQuestions();

}
```

/* ==================================================
COLLECT ANSWERS
================================================== */

function collectAnswers() {

```
const answers = [];


currentQuestions.forEach(
    question => {

        const selected =
            document.querySelector(
                `input[name="question_${question.id}"]:checked`
            );


        if (!selected) {
            return;
        }


        const observationElement =
            document.getElementById(
                `observation_${question.id}`
            );


        const observation =
            observationElement
                ? observationElement.value.trim()
                : "";


        answers.push({

            question:
                question.id,

            answer:
                selected.value,

            observation:
                observation

        });

    }
);


return answers;
```

}

/* ==================================================
VALIDATE ANSWERS
================================================== */

function validateAnswers() {

```
const answers =
    collectAnswers();


const answeredIds =
    answers.map(
        answer => answer.question
    );


const missingQuestions =
    currentQuestions.filter(
        question =>
            !answeredIds.includes(
                question.id
            )
    );


if (
    missingQuestions.length > 0
) {

    showMessage(
        `Please answer all questions. Missing ${missingQuestions.length} question(s).`,
        "danger"
    );

    return false;

}


for (
    const answer of answers
) {

    const question =
        currentQuestions.find(
            question =>
                question.id ===
                answer.question
        );


    if (
        answer.answer === "NO" &&
        question.requires_observation_on_no &&
        !answer.observation
    ) {

        showMessage(
            `Observation is required for: ${question.question_text}`,
            "danger"
        );

        return false;

    }

}


return true;
```

}

/* ==================================================
CREATE INSPECTION
================================================== */

async function createInspection() {

```
const payload = {

    plant:
        Number(
            plantSelect.value
        ),

    template:
        Number(
            templateSelect.value
        ),

    inspection_date:
        inspectionDate.value,

    general_notes:
        generalNotes.value

};


const response =
    await fetch(
        INSPECTIONS_API,
        {
            method: "POST",

            headers:
                getHeaders(),

            body:
                JSON.stringify(
                    payload
                )
        }
    );


const data =
    await response.json();


if (!response.ok) {

    throw new Error(
        JSON.stringify(data)
    );

}


return data;
```

}

/* ==================================================
CREATE ANSWERS
================================================== */

async function createAnswers(
inspectionId
) {

```
const answers =
    collectAnswers();


for (
    const answer of answers
) {

    const payload = {

        inspection:
            inspectionId,

        question:
            answer.question,

        answer:
            answer.answer,

        observation:
            answer.observation

    };


    const response =
        await fetch(
            "/api/inspections/answers/",
            {
                method: "POST",

                headers:
                    getHeaders(),

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            JSON.stringify(data)
        );

    }

}
```

}

/* ==================================================
UPDATE EXISTING ANSWERS
================================================== */

async function updateExistingAnswers() {

```
const answers =
    collectAnswers();


for (
    const answer of answers
) {

    const existingAnswer =
        existingAnswers[
            answer.question
        ];


    if (!existingAnswer) {

        const payload = {

            inspection:
                editingInspectionId,

            question:
                answer.question,

            answer:
                answer.answer,

            observation:
                answer.observation

        };


        const createResponse =
            await fetch(
                "/api/inspections/answers/",
                {
                    method: "POST",

                    headers:
                        getHeaders(),

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const createData =
            await createResponse.json();


        if (!createResponse.ok) {

            throw new Error(
                JSON.stringify(
                    createData
                )
            );

        }


        continue;

    }


    const payload = {

        answer:
            answer.answer,

        observation:
            answer.observation

    };


    const response =
        await fetch(
            `/api/inspections/answers/${existingAnswer.id}/`,
            {
                method: "PATCH",

                headers:
                    getHeaders(),

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            JSON.stringify(
                data
            )
        );

    }

}
```

}

/* ==================================================
SAVE DRAFT
================================================== */

saveDraftButton.addEventListener(
"click",
async function() {

```
    if (
        !plantSelect.value
    ) {

        showMessage(
            "Please select a plant.",
            "danger"
        );

        return;

    }


    if (
        !templateSelect.value
    ) {

        showMessage(
            "Please select an inspection template.",
            "danger"
        );

        return;

    }


    if (
        !inspectionDate.value
    ) {

        showMessage(
            "Please select an inspection date.",
            "danger"
        );

        return;

    }


    if (
        !validateAnswers()
    ) {

        return;

    }


    saveDraftButton.disabled =
        true;


    try {

        let inspection;


        if (
            editingInspectionId
        ) {

            const response =
                await fetch(
                    `${INSPECTIONS_API}${editingInspectionId}/`,
                    {
                        method: "PATCH",

                        headers:
                            getHeaders(),

                        body:
                            JSON.stringify({
                                plant:
                                    Number(
                                        plantSelect.value
                                    ),

                                template:
                                    Number(
                                        templateSelect.value
                                    ),

                                inspection_date:
                                    inspectionDate.value,

                                general_notes:
                                    generalNotes.value
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    JSON.stringify(data)
                );

            }


            inspection =
                data;


            await updateExistingAnswers();

        } else {

            inspection =
                await createInspection();


            await createAnswers(
                inspection.id
            );


            existingAnswers = {};

        }


        showMessage(
            "Inspection saved successfully as a draft.",
            "success"
        );


        editingInspectionId =
            inspection.id;


        submitButton.classList.remove(
            "d-none"
        );


        cancelButton.classList.remove(
            "d-none"
        );


        await loadInspections();


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    } finally {

        saveDraftButton.disabled =
            false;

    }

}
```

/* ==================================================
LOAD INSPECTIONS

async function loadInspections() {

```
try {

    const response =
        await fetch(
            INSPECTIONS_API,
            {
                headers:
                    getHeaders()
            }
        );


    if (!response.ok) {

        throw new Error(
            "Unable to load inspections."
        );

    }


    const inspections =
        await response.json();


    inspectionTable.innerHTML =
        "";


    if (
        inspections.length === 0
    ) {

        inspectionTable.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="text-center"
                >
                    No inspections found.
                </td>

            </tr>

        `;

        return;

    }


    inspections.forEach(
        inspection => {

            const row =
                document.createElement(
                    "tr"
                );


            let actions =
                "";


            if (
                inspection.status ===
                "DRAFT"
            ) {

                actions = `

                    <button
                        class="btn btn-sm btn-primary me-1"
                        onclick="editInspection(${inspection.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="btn btn-sm btn-success"
                        onclick="submitInspection(${inspection.id})"
                    >
                        Submit
                    </button>

                `;

            } else {

                actions = `

                    <span class="text-muted">
                        Locked
                    </span>

                `;

            }


            row.innerHTML = `

                <td>
                    ${inspection.id}
                </td>

                <td>
                    ${inspection.plant}
                </td>

                <td>
                    ${inspection.template}
                </td>

                <td>
                    ${inspection.inspection_date}
                </td>

                <td>
                    ${formatStatus(
                        inspection.status
                    )}
                </td>

                <td>
                    ${formatDate(
                        inspection.created_at
                    )}
                </td>

                <td>
                    ${actions}
                </td>

            `;


            inspectionTable.appendChild(
                row
            );

        }
    );


} catch (error) {

    showMessage(
        error.message,
        "danger"
    );

}
```

}

/* ==================================================
STATUS
================================================== */

function formatStatus(
status
) {

```
if (
    status === "DRAFT"
) {

    return `
        <span class="badge bg-secondary">
            DRAFT
        </span>
    `;

}


if (
    status === "SUBMITTED"
) {

    return `
        <span class="badge bg-success">
            SUBMITTED
        </span>
    `;

}


if (
    status === "CORRECTED"
) {

    return `
        <span class="badge bg-warning text-dark">
            CORRECTED
        </span>
    `;

}


if (
    status === "REVIEW_REQUIRED"
) {

    return `
        <span class="badge bg-danger">
            REVIEW REQUIRED
        </span>
    `;

}


return status;
```

}

DATE

function formatDate(
dateString
) {

```
if (!dateString) {
    return "";
}


return new Date(
    dateString
).toLocaleString();

/* ==================================================
EDIT INSPECTION
================================================== */

async function editInspection(
id
) {

```
try {

    const response =
        await fetch(
            `${INSPECTIONS_API}${id}/`,
            {
                headers:
                    getHeaders()
            }
        );


    const inspection =
        await response.json();


    if (!response.ok) {

        throw new Error(
            JSON.stringify(
                inspection
            )
        );

    }


    if (
        inspection.status !==
        "DRAFT"
    ) {

        showMessage(
            "Only draft inspections can be edited.",
            "danger"
        );

        return;

    }


    editingInspectionId =
        id;


    plantSelect.value =
        inspection.plant;


    templateSelect.value =
        inspection.template;


    inspectionDate.value =
        inspection.inspection_date;


    generalNotes.value =
        inspection.general_notes || "";


    existingAnswers = {};


    /*
     * IMPORTANT:
     *
     * The inspection serializer already
     * returns the answers:
     *
     * inspection.answers
     *
     * Therefore we do NOT make:
     *
     * GET /api/inspections/answers/
     *
     * anymore.
     */


    const answers =
        inspection.answers || [];


    answers.forEach(
        answer => {

            existingAnswers[
                answer.question
            ] = answer;

        }
    );


    await loadQuestions();


    /*
     * Render the saved answers into
     * the question controls.
     */

    answers.forEach(
        answer => {

            const radio =
                document.querySelector(
                    `input[name="question_${answer.question}"][value="${answer.answer}"]`
                );


            if (radio) {

                radio.checked =
                    true;


                radio.dispatchEvent(
                    new Event(
                        "change"
                    )
                );

            }


            const observation =
                document.getElementById(
                    `observation_${answer.question}`
                );


            if (observation) {

                observation.value =
                    answer.observation || "";

            }

        }
    );


    saveDraftButton.textContent =
        "Update Draft";


    submitButton.classList.remove(
        "d-none"
    );


    cancelButton.classList.remove(
        "d-none"
    );

```

/* ==================================================
SUBMIT INSPECTION
================================================== */

async function submitInspection(
id
) {

```
const confirmed =
    confirm(
        "Are you sure you want to submit this inspection? It cannot be edited after submission."
    );


if (!confirmed) {
    return;
}


try {

    const response =
        await fetch(
            `${INSPECTIONS_API}${id}/submit/`,
            {
                method: "POST",

                headers:
                    getHeaders()
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        showMessage(
            JSON.stringify(data),
            "danger"
        );

        return;

    }


    showMessage(
        "Inspection submitted successfully.",
        "success"
    );


    editingInspectionId =
        null;


    existingAnswers =
        {};


    resetForm();


    await loadInspections();


} catch (error) {

    showMessage(
        "Unable to submit inspection.",
        "danger"
    );

}
```

}
