<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sanitation Inspection</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div class="container py-5">


    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Daily Sanitation Inspection
        </h2>

        <a
            href="/dashboard/"
            class="btn btn-secondary"
        >
            Dashboard
        </a>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="alert d-none"
    ></div>


    <!-- INSPECTION INFORMATION -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h4 class="mb-4">
                Inspection Information
            </h4>


            <!-- PLANT -->

            <div class="mb-3">

                <label
                    for="plant"
                    class="form-label"
                >
                    Plant
                </label>

                <select
                    id="plant"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Plant
                    </option>

                </select>

            </div>


            <!-- TEMPLATE -->

            <div class="mb-3">

                <label
                    for="template"
                    class="form-label"
                >
                    Inspection Template
                </label>

                <select
                    id="template"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Template
                    </option>

                </select>

            </div>


            <!-- DATE -->

            <div class="mb-3">

                <label
                    for="inspection_date"
                    class="form-label"
                >
                    Inspection Date
                </label>

                <input
                    type="date"
                    id="inspection_date"
                    class="form-control"
                    required
                >

                <div class="form-text">
                    Inspection date is automatically set to today's date.
                </div>

            </div>


            <!-- GENERAL NOTES -->

            <div class="mb-3">

                <label
                    for="general_notes"
                    class="form-label"
                >
                    General Notes
                </label>

                <textarea
                    id="general_notes"
                    class="form-control"
                    rows="3"
                ></textarea>

            </div>

        </div>

    </div>


    <!-- QUESTIONS -->

    <div id="questionsContainer">

        <div class="alert alert-info">

            Select a plant and inspection template
            to load the inspection questions.

        </div>

    </div>


    <!-- ACTION BUTTONS -->

    <div class="card shadow mt-4">

        <div class="card-body">

            <button
                type="button"
                id="saveDraftButton"
                class="btn btn-primary"
            >
                Save Draft
            </button>


            <button
                type="button"
                id="submitButton"
                class="btn btn-success ms-2 d-none"
            >
                Submit Inspection
            </button>


            <button
                type="button"
                id="cancelButton"
                class="btn btn-secondary ms-2 d-none"
            >
                Cancel Edit
            </button>

        </div>

    </div>


    <!-- EXISTING INSPECTIONS -->

    <div class="card shadow mt-4">

        <div class="card-body">

            <h4 class="mb-4">
                My Inspections
            </h4>


            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Plant
                            </th>

                            <th>
                                Template
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="inspectionTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>


/* ==================================================
   AUTHENTICATION
================================================== */

const accessToken =
    localStorage.getItem(
        "access_token"
    );


const PLANTS_API =
    "/api/plants/";


const TEMPLATES_API =
    "/api/inspections/templates/";


const QUESTIONS_API =
    "/api/inspections/questions/";


const INSPECTIONS_API =
    "/api/inspections/";


function setTodayDate() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    inspectionDate.value =
        `${year}-${month}-${day}`;

}


let editingInspectionId =
    null;


let currentQuestions =
    [];


let existingAnswers =
    {};


/* ==================================================
   LOGIN CHECK
================================================== */

if (!accessToken) {

    window.location.href =
        "/login/";

}


/* ==================================================
   ELEMENTS
================================================== */

const plantSelect =
    document.getElementById(
        "plant"
    );


const templateSelect =
    document.getElementById(
        "template"
    );


const inspectionDate =
    document.getElementById(
        "inspection_date"
    );


const generalNotes =
    document.getElementById(
        "general_notes"
    );


const questionsContainer =
    document.getElementById(
        "questionsContainer"
    );


const saveDraftButton =
    document.getElementById(
        "saveDraftButton"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const inspectionTable =
    document.getElementById(
        "inspectionTable"
    );


const message =
    document.getElementById(
        "message"
    );


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text,
    type = "success"
) {

    message.textContent =
        text;

    message.className =
        `alert alert-${type}`;

}


/* ==================================================
   HEADERS
================================================== */

function getHeaders() {

    return {

        "Authorization":
            `Bearer ${accessToken}`,

        "Content-Type":
            "application/json"

    };

}


/* ==================================================
   LOAD PLANTS
================================================== */

async function loadPlants() {

    plantSelect.innerHTML = `

        <option value="">
            Loading plants...
        </option>

    `;


    try {

        const response =
            await fetch(
                PLANTS_API,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to load plants."
            );

        }


        const plants =
            Array.isArray(data)
                ? data
                : data.results || [];


        plantSelect.innerHTML = `

            <option value="">
                Select Plant
            </option>

        `;


        plants.forEach(
            plant => {

                if (
                    plant.active === false
                ) {

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    plant.id;


                option.textContent =
                    `${plant.code} - ${plant.name}`;


                plantSelect.appendChild(
                    option
                );

            }
        );


        if (
            plantSelect.options.length === 1
        ) {

            showMessage(
                "No active plants were found.",
                "warning"
            );

        }

    } catch (error) {

        plantSelect.innerHTML = `

            <option value="">
                Unable to load plants
            </option>

        `;


        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   LOAD TEMPLATES
================================================== */

async function loadTemplates() {

    templateSelect.innerHTML = `

        <option value="">
            Loading templates...
        </option>

    `;


    try {

        const response =
            await fetch(
                TEMPLATES_API,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to load inspection templates."
            );

        }


        const templates =
            Array.isArray(data)
                ? data
                : data.results || [];


        templateSelect.innerHTML = `

            <option value="">
                Select Template
            </option>

        `;


        templates.forEach(
            template => {

                if (
                    template.active === false
                ) {

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    template.id;


                option.textContent =
                    template.name;


                templateSelect.appendChild(
                    option
                );

            }
        );


        if (
            templateSelect.options.length === 1
        ) {

            showMessage(
                "No active inspection templates were found.",
                "warning"
            );

        }

    } catch (error) {

        templateSelect.innerHTML = `

            <option value="">
                Unable to load templates
            </option>

        `;


        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   LOAD QUESTIONS
================================================== */

async function loadQuestions() {

    const templateId =
        templateSelect.value;


    if (!templateId) {

        currentQuestions = [];


        questionsContainer.innerHTML = `

            <div class="alert alert-info">

                Select an inspection template
                to load questions.

            </div>

        `;


        return;

    }


    questionsContainer.innerHTML = `

        <div class="alert alert-info">

            Loading inspection questions...

        </div>

    `;


    try {

        const response =
            await fetch(
                `${QUESTIONS_API}?template=${templateId}`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to load inspection questions."
            );

        }


        const questions =
            Array.isArray(data)
                ? data
                : data.results || [];


        currentQuestions =
            questions.filter(
                question =>
                    question.active !== false
            );


        renderQuestions(
            currentQuestions
        );


    } catch (error) {

        currentQuestions = [];


        questionsContainer.innerHTML = `

            <div class="alert alert-danger">

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==================================================
   GET QUESTION TEXT
================================================== */

function getQuestionText(
    question
) {

    return (
        question.question_text ||
        question.text ||
        question.question ||
        question.name ||
        `Question ${question.id}`
    );

}


/* ==================================================
   RENDER QUESTIONS
================================================== */

function renderQuestions(
    questions
) {

    questionsContainer.innerHTML =
        "";


    if (
        questions.length === 0
    ) {

        questionsContainer.innerHTML = `

            <div class="alert alert-warning">

                No active questions were found
                for this template.

            </div>

        `;


        return;

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card shadow";


    const body =
        document.createElement(
            "div"
        );


    body.className =
        "card-body";


    const heading =
        document.createElement(
            "h4"
        );


    heading.className =
        "mb-4";


    heading.textContent =
        "Inspection Questions";


    body.appendChild(
        heading
    );


    questions.forEach(
        (
            question,
            index
        ) => {

            const questionCard =
                document.createElement(
                    "div"
                );


            questionCard.className =
                "border rounded p-3 mb-3";


            const questionText =
                document.createElement(
                    "div"
                );


            questionText.className =
                "mb-3";


            const strong =
                document.createElement(
                    "strong"
                );


            const text =
                getQuestionText(
                    question
                );


            strong.textContent =
                `${index + 1}. ${text}`;


            questionText.appendChild(
                strong
            );


            questionCard.appendChild(
                questionText
            );


            /* ==========================================
               ANSWER BUTTONS

               N/A HAS BEEN REMOVED.
               ONLY YES AND NO ARE AVAILABLE.
            ========================================== */

            const answerContainer =
                document.createElement(
                    "div"
                );


            answerContainer.className =
                "mb-3";


            const choices = [

                {
                    value: "YES",
                    label: "YES"
                },

                {
                    value: "NO",
                    label: "NO"
                }

            ];


            choices.forEach(
                choice => {

                    const wrapper =
                        document.createElement(
                            "div"
                        );


                    wrapper.className =
                        "form-check form-check-inline";


                    const radio =
                        document.createElement(
                            "input"
                        );


                    radio.className =
                        "form-check-input answer-radio";


                    radio.type =
                        "radio";


                    radio.name =
                        `question_${question.id}`;


                    radio.value =
                        choice.value;


                    radio.dataset.questionId =
                        question.id;


                    radio.dataset.requiresObservation =
                        question.requires_observation_on_no;


                    const label =
                        document.createElement(
                            "label"
                        );


                    label.className =
                        "form-check-label";


                    label.textContent =
                        choice.label;


                    wrapper.appendChild(
                        radio
                    );


                    wrapper.appendChild(
                        label
                    );


                    answerContainer.appendChild(
                        wrapper
                    );

                }
            );


            questionCard.appendChild(
                answerContainer
            );


            /* ==========================================
               OBSERVATION
            ========================================== */

            const observationContainer =
                document.createElement(
                    "div"
                );


            observationContainer.id =
                `observation_container_${question.id}`;


            observationContainer.className =
                "d-none";


            const observationLabel =
                document.createElement(
                    "label"
                );


            observationLabel.className =
                "form-label";


            observationLabel.textContent =
                "Observation";


            const observation =
                document.createElement(
                    "textarea"
                );


            observation.id =
                `observation_${question.id}`;


            observation.className =
                "form-control";


            observation.rows =
                2;


            observation.placeholder =
                "Enter observation...";


            observationContainer.appendChild(
                observationLabel
            );


            observationContainer.appendChild(
                observation
            );


            questionCard.appendChild(
                observationContainer
            );


            body.appendChild(
                questionCard
            );

        }
    );


    card.appendChild(
        body
    );


    questionsContainer.appendChild(
        card
    );


    attachAnswerListeners();

}


/* ==================================================
   ANSWER LISTENERS
================================================== */

function attachAnswerListeners() {

    const radios =
        document.querySelectorAll(
            ".answer-radio"
        );


    radios.forEach(
        radio => {

            radio.addEventListener(
                "change",
                function() {

                    const questionId =
                        this.dataset.questionId;


                    const requiresObservation =
                        this.dataset.requiresObservation ===
                        "true";


                    const observationContainer =
                        document.getElementById(
                            `observation_container_${questionId}`
                        );


                    if (
                        this.value === "NO" &&
                        requiresObservation
                    ) {

                        observationContainer
                            .classList
                            .remove(
                                "d-none"
                            );

                    }

                    else {

                        observationContainer
                            .classList
                            .add(
                                "d-none"
                            );

                    }

                }
            );

        }
    );

}


/* ==================================================
   TEMPLATE CHANGE
================================================== */

templateSelect.addEventListener(
    "change",
    async function() {

        existingAnswers = {};


        await loadQuestions();

    }
);


/* ==================================================
   COLLECT ANSWERS
================================================== */

function collectAnswers() {

    const answers = [];


    currentQuestions.forEach(
        question => {

            const selected =
                document.querySelector(
                    `input[name="question_${question.id}"]:checked`
                );


            if (!selected) {

                return;

            }


            const observationElement =
                document.getElementById(
                    `observation_${question.id}`
                );


            const observation =
                observationElement
                    ? observationElement.value.trim()
                    : "";


            answers.push({

                question:
                    question.id,

                answer:
                    selected.value,

                observation:
                    observation

            });

        }
    );


    return answers;

}


/* ==================================================
   VALIDATE ANSWERS
================================================== */

function validateAnswers() {

    const answers =
        collectAnswers();


    const answeredIds =
        answers.map(
            answer =>
                answer.question
        );


    const missingQuestions =
        currentQuestions.filter(
            question =>
                !answeredIds.includes(
                    question.id
                )
        );


    if (
        missingQuestions.length > 0
    ) {

        showMessage(
            `Please answer all questions. Missing ${missingQuestions.length} question(s).`,
            "danger"
        );


        return false;

    }


    for (
        const answer of answers
    ) {

        const question =
            currentQuestions.find(
                question =>
                    question.id ===
                    answer.question
            );


        if (
            answer.answer === "NO" &&
            question.requires_observation_on_no &&
            !answer.observation
        ) {

            showMessage(
                `Observation is required for: ${getQuestionText(question)}`,
                "danger"
            );


            return false;

        }

    }


    return true;

}


/* ==================================================
   CREATE INSPECTION
================================================== */

async function createInspection() {

    const payload = {

        plant:
            Number(
                plantSelect.value
            ),

        template:
            Number(
                templateSelect.value
            ),

        inspection_date:
            inspectionDate.value,

        general_notes:
            generalNotes.value

    };


    const response =
        await fetch(
            INSPECTIONS_API,
            {
                method: "POST",

                headers:
                    getHeaders(),

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            JSON.stringify(data)
        );

    }


    return data;

}


/* ==================================================
   CREATE ANSWERS
================================================== */

async function createAnswers(
    inspectionId
) {

    const answers =
        collectAnswers();


    for (
        const answer of answers
    ) {

        const payload = {

            inspection:
                inspectionId,

            question:
                answer.question,

            answer:
                answer.answer,

            observation:
                answer.observation

        };


        const response =
            await fetch(
                "/api/inspections/answers/",
                {
                    method: "POST",

                    headers:
                        getHeaders(),

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    data
                )
            );

        }

    }

}


/* ==================================================
   UPDATE EXISTING ANSWERS
================================================== */

async function updateExistingAnswers() {

    const answers =
        collectAnswers();


    for (
        const answer of answers
    ) {

        const existingAnswer =
            existingAnswers[
                answer.question
            ];


        if (!existingAnswer) {

            const payload = {

                inspection:
                    editingInspectionId,

                question:
                    answer.question,

                answer:
                    answer.answer,

                observation:
                    answer.observation

            };


            const createResponse =
                await fetch(
                    "/api/inspections/answers/",
                    {
                        method: "POST",

                        headers:
                            getHeaders(),

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            const createData =
                await createResponse.json();


            if (!createResponse.ok) {

                throw new Error(
                    JSON.stringify(
                        createData
                    )
                );

            }


            continue;

        }


        const payload = {

            answer:
                answer.answer,

            observation:
                answer.observation

        };


        const response =
            await fetch(
                `/api/inspections/answers/${existingAnswer.id}/`,
                {
                    method: "PATCH",

                    headers:
                        getHeaders(),

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    data
                )
            );

        }

    }

}


/* ==================================================
   SAVE DRAFT
================================================== */

saveDraftButton.addEventListener(
    "click",
    async function() {

        if (
            !plantSelect.value
        ) {

            showMessage(
                "Please select a plant.",
                "danger"
            );

            return;

        }


        if (
            !templateSelect.value
        ) {

            showMessage(
                "Please select an inspection template.",
                "danger"
            );

            return;

        }


        if (
            !inspectionDate.value
        ) {

            showMessage(
                "Please select an inspection date.",
                "danger"
            );

            return;

        }


        if (
            !validateAnswers()
        ) {

            return;

        }


        saveDraftButton.disabled =
            true;


        try {

            let inspection;


            if (
                editingInspectionId
            ) {

                const response =
                    await fetch(
                        `${INSPECTIONS_API}${editingInspectionId}/`,
                        {
                            method: "PATCH",

                            headers:
                                getHeaders(),

                            body:
                                JSON.stringify({

                                    plant:
                                        Number(
                                            plantSelect.value
                                        ),

                                    template:
                                        Number(
                                            templateSelect.value
                                        ),

                                    inspection_date:
                                        inspectionDate.value,

                                    general_notes:
                                        generalNotes.value

                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        JSON.stringify(data)
                    );

                }


                inspection =
                    data;


                await updateExistingAnswers();

            }

            else {

                inspection =
                    await createInspection();


                await createAnswers(
                    inspection.id
                );


                existingAnswers = {};

            }


            showMessage(
                "Inspection saved successfully as a draft.",
                "success"
            );


            editingInspectionId =
                inspection.id;


            submitButton.classList.remove(
                "d-none"
            );


            cancelButton.classList.remove(
                "d-none"
            );


            await loadInspections();


        }

        catch (error) {

            showMessage(
                error.message,
                "danger"
            );

        }

        finally {

            saveDraftButton.disabled =
                false;

        }

    }
);


/* ==================================================
   LOAD INSPECTIONS
================================================== */

async function loadInspections() {

    try {

        const response =
            await fetch(
                INSPECTIONS_API,
                {
                    method: "GET",

                    headers:
                        getHeaders()
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to load inspections."
            );

        }


        const inspections =
            Array.isArray(data)
                ? data
                : data.results || [];


        inspectionTable.innerHTML =
            "";


        if (
            inspections.length === 0
        ) {

            inspectionTable.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="text-center"
                    >
                        No inspections found.
                    </td>

                </tr>

            `;


            return;

        }


        inspections.forEach(
            inspection => {

                const row =
                    document.createElement(
                        "tr"
                    );


                let actions =
                    "";


                if (
                    inspection.status ===
                    "DRAFT"
                ) {

                    actions = `

                        <button
                            class="btn btn-sm btn-primary me-1"
                            onclick="editInspection(${inspection.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="btn btn-sm btn-success"
                            onclick="submitInspection(${inspection.id})"
                        >
                            Submit
                        </button>

                    `;

                }

                else {

                    actions = `

                        <span class="text-muted">
                            Locked
                        </span>

                    `;

                }


                row.innerHTML = `

                    <td>
                        ${inspection.id}
                    </td>

                    <td>
                        ${
                            inspection.plant_name ||
                            `Plant ${inspection.plant}`
                        }
                    </td>

                    <td>
                        ${
                            inspection.template_name ||
                            `Template ${inspection.template}`
                        }
                    </td>

                    <td>
                        ${inspection.inspection_date}
                    </td>

                    <td>
                        ${formatStatus(
                            inspection.status
                        )}
                    </td>

                    <td>
                        ${formatDate(
                            inspection.created_at
                        )}
                    </td>

                    <td>
                        ${actions}
                    </td>

                `;


                inspectionTable.appendChild(
                    row
                );

            }
        );


    }

    catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   STATUS
================================================== */

function formatStatus(
    status
) {

    if (
        status === "DRAFT"
    ) {

        return `

            <span class="badge bg-secondary">
                DRAFT
            </span>

        `;

    }


    if (
        status === "SUBMITTED"
    ) {

        return `

            <span class="badge bg-success">
                SUBMITTED
            </span>

        `;

    }


    if (
        status === "CORRECTED"
    ) {

        return `

            <span class="badge bg-warning text-dark">
                CORRECTED
            </span>

        `;

    }


    if (
        status === "REVIEW_REQUIRED"
    ) {

        return `

            <span class="badge bg-danger">
                REVIEW REQUIRED
            </span>

        `;

    }


    return escapeHtml(
        status || "-"
    );

}


/* ==================================================
   DATE
================================================== */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "";

    }


    return new Date(
        dateString
    ).toLocaleString();

}


/* ==================================================
   EDIT INSPECTION
================================================== */

async function editInspection(
    id
) {

    try {

        const response =
            await fetch(
                `${INSPECTIONS_API}${id}/`,
                {
                    method: "GET",

                    headers:
                        getHeaders()
                }
            );


        const inspection =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    inspection
                )
            );

        }


        if (
            inspection.status !==
            "DRAFT"
        ) {

            showMessage(
                "Only draft inspections can be edited.",
                "danger"
            );

            return;

        }


        editingInspectionId =
            id;


        plantSelect.value =
            inspection.plant;


        templateSelect.value =
            inspection.template;


        inspectionDate.value =
            inspection.inspection_date;


        generalNotes.value =
            inspection.general_notes ||
            "";


        existingAnswers = {};


        const answers =
            inspection.answers ||
            [];


        answers.forEach(
            answer => {

                existingAnswers[
                    answer.question
                ] = answer;

            }
        );


        await loadQuestions();


        answers.forEach(
            answer => {

                const radio =
                    document.querySelector(
                        `input[name="question_${answer.question}"][value="${answer.answer}"]`
                    );


                if (radio) {

                    radio.checked =
                        true;


                    radio.dispatchEvent(
                        new Event(
                            "change"
                        )
                    );

                }


                const observation =
                    document.getElementById(
                        `observation_${answer.question}`
                    );


                if (observation) {

                    observation.value =
                        answer.observation ||
                        "";

                }

            }
        );


        saveDraftButton.textContent =
            "Update Draft";


        submitButton.classList.remove(
            "d-none"
        );


        cancelButton.classList.remove(
            "d-none"
        );


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });


    }

    catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* ==================================================
   SUBMIT INSPECTION
================================================== */

async function submitInspection(
    id
) {

    const confirmed =
        confirm(
            "Are you sure you want to submit this inspection? It cannot be edited after submission."
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${INSPECTIONS_API}${id}/submit/`,
                {
                    method: "POST",

                    headers:
                        getHeaders()
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                JSON.stringify(data),
                "danger"
            );

            return;

        }


        showMessage(
            "Inspection submitted successfully.",
            "success"
        );


        editingInspectionId =
            null;


        existingAnswers =
            {};


        resetForm();


        await loadInspections();


    }

    catch (error) {

        showMessage(
            "Unable to submit inspection.",
            "danger"
        );

    }

}


/* ==================================================
   CANCEL EDIT
================================================== */

cancelButton.addEventListener(
    "click",
    function() {

        editingInspectionId =
            null;


        existingAnswers =
            {};


        resetForm();

    }
);


/* ==================================================
   RESET FORM
================================================== */

function resetForm() {

    plantSelect.value =
        "";


    templateSelect.value =
        "";


    inspectionDate.value =
        "";


    generalNotes.value =
        "";


    questionsContainer.innerHTML = `

        <div class="alert alert-info">

            Select a plant and inspection template
            to load the inspection questions.

        </div>

    `;


    currentQuestions =
        [];


    existingAnswers =
        {};


    saveDraftButton.textContent =
        "Save Draft";


    submitButton.classList.add(
        "d-none"
    );


    cancelButton.classList.add(
        "d-none"
    );

}


/* ==================================================
   INITIAL LOAD
================================================== */

async function initializePage() {

    setTodayDate();

    await loadPlants();

    await loadTemplates();

    await loadInspections();

}


initializePage();


</script>
