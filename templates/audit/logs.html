<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audit Logs</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container-fluid mt-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Audit Logs</h2>

            <p class="text-muted mb-0">
                View system activity and record changes.
            </p>
        </div>

        <button
            class="btn btn-primary"
            onclick="loadAuditLogs()"
        >
            Refresh
        </button>

    </div>


    <!-- Message -->
    <div id="message"></div>


    <!-- Filters -->
    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="mb-3">
                Filter Audit Logs
            </h5>

            <div class="row g-3">

                <!-- User Filter -->
                <div class="col-md-3">

                    <label
                        for="userFilter"
                        class="form-label"
                    >
                        User
                    </label>

                    <select
                        id="userFilter"
                        class="form-select"
                    >
                        <option value="">
                            All Users
                        </option>
                    </select>

                </div>


                <!-- Action Filter -->
                <div class="col-md-3">

                    <label
                        for="actionFilter"
                        class="form-label"
                    >
                        Action
                    </label>

                    <select
                        id="actionFilter"
                        class="form-select"
                    >
                        <option value="">
                            All Actions
                        </option>
                    </select>

                </div>


                <!-- Object Type Filter -->
                <div class="col-md-3">

                    <label
                        for="objectFilter"
                        class="form-label"
                    >
                        Object Type
                    </label>

                    <select
                        id="objectFilter"
                        class="form-select"
                    >
                        <option value="">
                            All Records
                        </option>
                    </select>

                </div>


                <!-- Search -->
                <div class="col-md-3">

                    <label
                        for="searchFilter"
                        class="form-label"
                    >
                        Search
                    </label>

                    <input
                        type="text"
                        id="searchFilter"
                        class="form-control"
                        placeholder="Search logs..."
                    >

                </div>

            </div>


            <!-- Clear Filters -->
            <div class="mt-3">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="clearFilters()"
                >
                    Clear Filters
                </button>

            </div>

        </div>

    </div>


    <!-- Audit Logs Table -->
    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>
                                Date / Time
                            </th>

                            <th>
                                User
                            </th>

                            <th>
                                Action
                            </th>

                            <th>
                                Record
                            </th>

                            <th>
                                Reason
                            </th>

                        </tr>

                    </thead>


                    <tbody id="auditTableBody">

                        <tr>

                            <td
                                colspan="5"
                                class="text-center"
                            >
                                Loading audit logs...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

let auditLogs = [];


/*
    Load Audit Logs
*/
async function loadAuditLogs() {

    const tableBody =
        document.getElementById("auditTableBody");

    const message =
        document.getElementById("message");


    tableBody.innerHTML = `
        <tr>
            <td colspan="5" class="text-center">
                Loading audit logs...
            </td>
        </tr>
    `;

    message.innerHTML = "";


    try {

        const token =
            localStorage.getItem("access_token");


        if (!token) {

            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="text-center text-danger"
                    >
                        Please log in first.
                    </td>
                </tr>
            `;

            return;
        }


        const response = await fetch(
            "/api/audit/",
            {
                method: "GET",

                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                `Request failed with status ${response.status}`
            );

        }


        const data = await response.json();


        /*
            Store the audit logs.

            DRF normally returns an array here.
            This also handles paginated responses
            if pagination is enabled later.
        */
        if (Array.isArray(data)) {

            auditLogs = data;

        } else if (data.results) {

            auditLogs = data.results;

        } else {

            auditLogs = [];

        }


        populateFilters();

        displayAuditLogs(auditLogs);


    } catch (error) {

        console.error(
            "Audit log error:",
            error
        );


        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="text-center text-danger"
                >
                    Unable to load audit logs.
                </td>
            </tr>
        `;


        message.innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }

}


/*
    Populate Filter Dropdowns
*/
function populateFilters() {

    const userFilter =
        document.getElementById("userFilter");

    const actionFilter =
        document.getElementById("actionFilter");

    const objectFilter =
        document.getElementById("objectFilter");


    /*
        Save currently selected values
        before rebuilding the options.
    */
    const selectedUser =
        userFilter.value;

    const selectedAction =
        actionFilter.value;

    const selectedObject =
        objectFilter.value;


    /*
        Clear existing options
    */
    userFilter.innerHTML = `
        <option value="">
            All Users
        </option>
    `;

    actionFilter.innerHTML = `
        <option value="">
            All Actions
        </option>
    `;

    objectFilter.innerHTML = `
        <option value="">
            All Records
        </option>
    `;


    /*
        Create unique values
    */
    const users = [
        ...new Set(
            auditLogs
                .map(log => log.username)
                .filter(Boolean)
        )
    ].sort();


    const actions = [
        ...new Set(
            auditLogs
                .map(log => log.action)
                .filter(Boolean)
        )
    ].sort();


    const objects = [
        ...new Set(
            auditLogs
                .map(log => log.object_type)
                .filter(Boolean)
        )
    ].sort();


    /*
        Add Users
    */
    users.forEach(user => {

        const option =
            document.createElement("option");

        option.value = user;
        option.textContent = user;

        userFilter.appendChild(option);

    });


    /*
        Add Actions
    */
    actions.forEach(action => {

        const option =
            document.createElement("option");

        option.value = action;
        option.textContent = action;

        actionFilter.appendChild(option);

    });


    /*
        Add Object Types
    */
    objects.forEach(objectType => {

        const option =
            document.createElement("option");

        option.value = objectType;
        option.textContent = objectType;

        objectFilter.appendChild(option);

    });


    /*
        Restore selected values
    */
    if (users.includes(selectedUser)) {
        userFilter.value = selectedUser;
    }

    if (actions.includes(selectedAction)) {
        actionFilter.value = selectedAction;
    }

    if (objects.includes(selectedObject)) {
        objectFilter.value = selectedObject;
    }

}


/*
    Display Audit Logs
*/
function displayAuditLogs(logs) {

    const tableBody =
        document.getElementById("auditTableBody");


    tableBody.innerHTML = "";


    /*
        No records
    */
    if (!logs || logs.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="text-center text-muted"
                >
                    No audit logs found.
                </td>
            </tr>
        `;

        return;
    }


    /*
        Display each log
    */
    logs.forEach(log => {

        const row =
            document.createElement("tr");


        /*
            Date / Time
        */
        const timestamp =
            log.timestamp
                ? new Date(
                    log.timestamp
                ).toLocaleString()
                : "-";


        /*
            Record
        */
        const record =
            log.object_type
                ? `${log.object_type} #${log.object_id ?? "-"}`
                : "-";


        /*
            Reason
        */
        const reason =
            log.reason || "-";


        row.innerHTML = `

            <td>
                ${timestamp}
            </td>

            <td>
                ${log.username || "-"}
            </td>

            <td>
                <span class="badge bg-secondary">
                    ${log.action || "-"}
                </span>
            </td>

            <td>
                ${record}
            </td>

            <td>
                ${reason}
            </td>

        `;


        tableBody.appendChild(row);

    });

}


/*
    Apply Filters
*/
function applyFilters() {

    const userValue =
        document.getElementById(
            "userFilter"
        ).value;


    const actionValue =
        document.getElementById(
            "actionFilter"
        ).value;


    const objectValue =
        document.getElementById(
            "objectFilter"
        ).value;


    const searchValue =
        document.getElementById(
            "searchFilter"
        ).value
        .toLowerCase()
        .trim();


    /*
        Filter the original audit logs
    */
    const filteredLogs =
        auditLogs.filter(log => {


            /*
                User
            */
            if (
                userValue &&
                log.username !== userValue
            ) {

                return false;

            }


            /*
                Action
            */
            if (
                actionValue &&
                log.action !== actionValue
            ) {

                return false;

            }


            /*
                Object Type
            */
            if (
                objectValue &&
                log.object_type !== objectValue
            ) {

                return false;

            }


            /*
                Search
            */
            if (searchValue) {

                const searchableText = [

                    log.username,
                    log.action,
                    log.object_type,
                    log.object_id,
                    log.reason,
                    log.timestamp

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                if (
                    !searchableText.includes(
                        searchValue
                    )
                ) {

                    return false;

                }

            }


            return true;

        });


    displayAuditLogs(filteredLogs);

}


/*
    Clear Filters
*/
function clearFilters() {

    document.getElementById(
        "userFilter"
    ).value = "";


    document.getElementById(
        "actionFilter"
    ).value = "";


    document.getElementById(
        "objectFilter"
    ).value = "";


    document.getElementById(
        "searchFilter"
    ).value = "";


    displayAuditLogs(auditLogs);

}


/*
    Filter Events
*/
document
    .getElementById("userFilter")
    .addEventListener(
        "change",
        applyFilters
    );


document
    .getElementById("actionFilter")
    .addEventListener(
        "change",
        applyFilters
    );


document
    .getElementById("objectFilter")
    .addEventListener(
        "change",
        applyFilters
    );


document
    .getElementById("searchFilter")
    .addEventListener(
        "input",
        applyFilters
    );


/*
    Load logs when page opens
*/
document.addEventListener(
    "DOMContentLoaded",
    loadAuditLogs
);

</script>

</body>
</html>
