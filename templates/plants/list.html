<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plant Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Plant Management
            </h1>

            <p class="text-muted mb-0">
                Manage Plant A and Plant B.
            </p>

        </div>

        <a
            href="/dashboard/"
            class="btn btn-secondary"
        >
            Back to Dashboard
        </a>

    </div>


    <!-- Message -->

    <div
        id="message"
        class="d-none"
    ></div>


    <!-- Create Plant -->

    <div
        id="createPlantSection"
        class="card mb-4"
    >

        <div class="card-header">

            <h5 class="mb-0">
                Create Plant
            </h5>

        </div>

        <div class="card-body">

            <form id="createPlantForm">

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label
                            for="code"
                            class="form-label"
                        >
                            Plant Code
                        </label>

                        <input
                            type="text"
                            id="code"
                            class="form-control"
                            placeholder="PLANT_C"
                            required
                        >

                    </div>


                    <div class="col-md-5 mb-3">

                        <label
                            for="name"
                            class="form-label"
                        >
                            Plant Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Plant C"
                            required
                        >

                    </div>


                    <div class="col-md-3 mb-3">

                        <label
                            for="active"
                            class="form-label"
                        >
                            Status
                        </label>

                        <select
                            id="active"
                            class="form-select"
                        >

                            <option value="true">
                                Active
                            </option>

                            <option value="false">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Plant
                </button>

            </form>

        </div>

    </div>


    <!-- Plants -->

    <div class="card">

        <div class="card-header">

            <h5 class="mb-0">
                Plants
            </h5>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="plantsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "/api/plants/";


function getAccessToken() {

    return localStorage.getItem(
        "access_token"
    );

}


function showMessage(
    message,
    type = "success"
) {

    const messageBox =
        document.getElementById(
            "message"
        );

    messageBox.className =
        `alert alert-${type}`;

    messageBox.textContent =
        message;

}


async function loadPlants() {

    const token =
        getAccessToken();

    if (!token) {

        showMessage(
            "Authentication token not found.",
            "danger"
        );

        return;
    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Unable to load plants."
            );

        }


        const tableBody =
            document.getElementById(
                "plantsTableBody"
            );

        tableBody.innerHTML = "";


        data.forEach(
            plant => {

                const status =
                    plant.active
                        ? `<span class="badge bg-success">
                               Active
                           </span>`
                        : `<span class="badge bg-danger">
                               Inactive
                           </span>`;


                tableBody.innerHTML += `

                    <tr>

                        <td>
                            ${plant.id}
                        </td>

                        <td>
                            ${plant.code}
                        </td>

                        <td>
                            ${plant.name}
                        </td>

                        <td>
                            ${status}
                        </td>

                    </tr>

                `;

            }
        );

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


document
    .getElementById(
        "createPlantForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const token =
                getAccessToken();


            if (!token) {

                showMessage(
                    "Authentication token not found.",
                    "danger"
                );

                return;

            }


            const data = {

                code:
                    document.getElementById(
                        "code"
                    ).value.trim(),

                name:
                    document.getElementById(
                        "name"
                    ).value.trim(),

                active:
                    document.getElementById(
                        "active"
                    ).value === "true"

            };


            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        JSON.stringify(result)
                    );

                }


                showMessage(
                    "Plant created successfully."
                );


                document
                    .getElementById(
                        "createPlantForm"
                    )
                    .reset();


                loadPlants();

            } catch (error) {

                showMessage(
                    error.message,
                    "danger"
                );

            }

        }
    );


loadPlants();

</script>

</body>

</html>
