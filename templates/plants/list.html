<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plant Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Plant Management
            </h1>

            <p class="text-muted mb-2">
                View Plant A and Plant B.
            </p>

            <div>

                <span class="text-muted">
                    Logged in as:
                </span>

                <strong>
                    {{ user.username }}
                </strong>

                {% if user.groups.all %}

                    {% for group in user.groups.all %}

                        <span class="badge bg-primary ms-2">
                            {{ group.name }}
                        </span>

                    {% endfor %}

                {% endif %}

            </div>

        </div>

        <a
            href="/dashboard/"
            class="btn btn-secondary"
        >
            Back to Dashboard
        </a>

    </div>


    <!-- Message -->

    <div
        id="message"
        class="d-none"
    ></div>


    <!-- Plants -->

    <div class="card shadow-sm">

        <div class="card-header">

            <h5 class="mb-0">
                Plants
            </h5>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="plantsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "/api/plants/";


function getAccessToken() {

    return localStorage.getItem(
        "access_token"
    );

}


function showMessage(
    message,
    type = "success"
) {

    const messageBox =
        document.getElementById(
            "message"
        );

    messageBox.className =
        `alert alert-${type}`;

    messageBox.textContent =
        message;

}


async function loadPlants() {

    const token =
        getAccessToken();


    if (!token) {

        showMessage(
            "Authentication token not found.",
            "danger"
        );

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Unable to load plants."
            );

        }


        const tableBody =
            document.getElementById(
                "plantsTableBody"
            );


        tableBody.innerHTML = "";


        data.forEach(
            plant => {

                const status =
                    plant.active
                        ? `<span class="badge bg-success">
                               Active
                           </span>`
                        : `<span class="badge bg-danger">
                               Inactive
                           </span>`;


                tableBody.innerHTML += `

                    <tr>

                        <td>
                            ${plant.id}
                        </td>

                        <td>
                            <strong>
                                ${plant.code}
                            </strong>
                        </td>

                        <td>
                            ${plant.name}
                        </td>

                        <td>
                            ${status}
                        </td>

                    </tr>

                `;

            }
        );


        if (data.length === 0) {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="text-center text-muted"
                    >
                        No plants found.
                    </td>

                </tr>

            `;

        }

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


loadPlants();

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
