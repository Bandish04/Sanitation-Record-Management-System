<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plant Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">


    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Plant Management
            </h1>

            <p class="text-muted mb-2">
                Manage plants and plant information.
            </p>

            <div>

                <span class="text-muted">
                    Logged in as:
                </span>

                <strong>
                    {{ user.username }}
                </strong>


                {% for group in user.groups.all %}

                    <span class="badge bg-primary ms-2">
                        {{ group.name }}
                    </span>

                {% endfor %}

            </div>

        </div>


        <a
            href="/dashboard/"
            class="btn btn-secondary"
        >
            Back to Dashboard
        </a>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="d-none"
    ></div>


    <!-- PLANTS CARD -->

    <div class="card shadow-sm">


        <div class="card-header d-flex justify-content-between align-items-center">

            <h5 class="mb-0">
                Plants
            </h5>


            <!-- ADMIN ONLY -->

            <button
                id="addPlantButton"
                type="button"
                class="btn btn-primary"
                onclick="openAddPlantModal()"
            >
                + Add Plant
            </button>

        </div>


        <div class="card-body">


            <div class="table-responsive">


                <table class="table table-bordered table-hover align-middle">


                    <thead class="table-dark">

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Status
                            </th>

                            <th
                                id="actionsHeader"
                            >
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="plantsTableBody">

                    </tbody>


                </table>


            </div>


        </div>

    </div>


</div>


<!-- =========================================================
     ADD / EDIT PLANT MODAL
========================================================= -->

<div
    class="modal fade"
    id="plantModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="plantModalTitle"
                >
                    Add Plant
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <div class="modal-body">


                <div
                    id="modalMessage"
                    class="alert d-none"
                ></div>


                <input
                    type="hidden"
                    id="plantId"
                >


                <!-- CODE -->

                <div class="mb-3">

                    <label
                        for="plantCode"
                        class="form-label"
                    >
                        Plant Code
                    </label>

                    <input
                        type="text"
                        id="plantCode"
                        class="form-control"
                        placeholder="Example: PLANT_C"
                    >

                </div>


                <!-- NAME -->

                <div class="mb-3">

                    <label
                        for="plantName"
                        class="form-label"
                    >
                        Plant Name
                    </label>

                    <input
                        type="text"
                        id="plantName"
                        class="form-control"
                        placeholder="Example: Plant C"
                    >

                </div>


                <!-- ACTIVE -->

                <div class="form-check">

                    <input
                        type="checkbox"
                        id="plantActive"
                        class="form-check-input"
                        checked
                    >

                    <label
                        for="plantActive"
                        class="form-check-label"
                    >
                        Active
                    </label>

                </div>


            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    id="savePlantButton"
                    class="btn btn-primary"
                    onclick="savePlant()"
                >
                    Save Plant
                </button>

            </div>


        </div>

    </div>

</div>


<!-- BOOTSTRAP -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script>


/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL = "/api/plants/";


/* =========================================================
   DETERMINE WHETHER CURRENT USER IS ADMIN
========================================================= */

let isAdmin = false;


{% for group in user.groups.all %}

    {% if group.name == "Admin" %}

        isAdmin = true;

    {% endif %}

{% endfor %}


/* =========================================================
   ELEMENTS
========================================================= */

const plantsTableBody =
    document.getElementById(
        "plantsTableBody"
    );


const message =
    document.getElementById(
        "message"
    );


const actionsHeader =
    document.getElementById(
        "actionsHeader"
    );


const addPlantButton =
    document.getElementById(
        "addPlantButton"
    );


const plantModalElement =
    document.getElementById(
        "plantModal"
    );


const plantModal =
    bootstrap.Modal.getOrCreateInstance(
        plantModalElement
    );


/* =========================================================
   TOKEN
========================================================= */

function getAccessToken() {

    return (
        localStorage.getItem(
            "access_token"
        ) ||
        localStorage.getItem(
            "access"
        )
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "success"
) {

    message.className =
        `alert alert-${type}`;

    message.textContent =
        text;

}


function hideMessage() {

    message.className =
        "d-none";

    message.textContent =
        "";

}


/* =========================================================
   MODAL MESSAGE
========================================================= */

function showModalMessage(
    text,
    type = "danger"
) {

    const modalMessage =
        document.getElementById(
            "modalMessage"
        );


    modalMessage.className =
        `alert alert-${type}`;

    modalMessage.textContent =
        text;

}


function hideModalMessage() {

    const modalMessage =
        document.getElementById(
            "modalMessage"
        );


    modalMessage.className =
        "alert d-none";

    modalMessage.textContent =
        "";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   LOAD PLANTS
========================================================= */

async function loadPlants() {

    hideMessage();


    const token =
        getAccessToken();


    if (!token) {

        showMessage(
            "Authentication token not found.",
            "danger"
        );

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        let data;


        try {

            data =
                await response.json();

        }

        catch (error) {

            data = null;

        }


        if (!response.ok) {

            throw new Error(
                data?.detail ||
                "Unable to load plants."
            );

        }


        let plants = [];


        if (Array.isArray(data)) {

            plants =
                data;

        }

        else if (
            data &&
            Array.isArray(data.results)
        ) {

            plants =
                data.results;

        }


        renderPlants(
            plants
        );


    }

    catch (error) {

        console.error(
            "Plant loading error:",
            error
        );


        showMessage(
            error.message,
            "danger"
        );

    }

}


/* =========================================================
   RENDER PLANTS
========================================================= */

function renderPlants(plants) {

    plantsTableBody.innerHTML =
        "";


    if (
        !plants ||
        plants.length === 0
    ) {

        const colspan =
            isAdmin
                ? 5
                : 4;


        plantsTableBody.innerHTML = `

            <tr>

                <td
                    colspan="${colspan}"
                    class="text-center text-muted py-4"
                >
                    No plants found.
                </td>

            </tr>

        `;


        return;

    }


    plants.forEach(
        function(plant) {

            const row =
                document.createElement(
                    "tr"
                );


            const status =
                plant.active

                    ? `
                        <span class="badge bg-success">
                            Active
                        </span>
                    `

                    : `
                        <span class="badge bg-danger">
                            Inactive
                        </span>
                    `;


            let actions = "";


            if (isAdmin) {

                actions = `

                    <button
                        type="button"
                        class="btn btn-sm btn-outline-primary me-2"
                        onclick="openEditPlantModal(${plant.id})"
                    >
                        Edit
                    </button>


                    <button
                        type="button"
                        class="btn btn-sm btn-outline-danger"
                        onclick="deletePlant(${plant.id}, '${escapeHtml(plant.code)}')"
                    >
                        Delete
                    </button>

                `;

            }


            row.innerHTML = `

                <td>
                    ${escapeHtml(plant.id)}
                </td>

                <td>

                    <strong>
                        ${escapeHtml(plant.code)}
                    </strong>

                </td>

                <td>
                    ${escapeHtml(plant.name)}
                </td>

                <td>
                    ${status}
                </td>

                ${
                    isAdmin
                        ? `
                            <td>
                                ${actions}
                            </td>
                        `
                        : ""
                }

            `;


            plantsTableBody.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   OPEN ADD MODAL
========================================================= */

function openAddPlantModal() {

    if (!isAdmin) {

        showMessage(
            "Only Admins can add plants.",
            "danger"
        );

        return;

    }


    hideModalMessage();


    document.getElementById(
        "plantModalTitle"
    ).textContent =
        "Add Plant";


    document.getElementById(
        "plantId"
    ).value =
        "";


    document.getElementById(
        "plantCode"
    ).value =
        "";


    document.getElementById(
        "plantName"
    ).value =
        "";


    document.getElementById(
        "plantActive"
    ).checked =
        true;


    document.getElementById(
        "savePlantButton"
    ).textContent =
        "Save Plant";


    plantModal.show();

}


/* =========================================================
   OPEN EDIT MODAL
========================================================= */

async function openEditPlantModal(plantId) {

    if (!isAdmin) {

        showMessage(
            "Only Admins can edit plants.",
            "danger"
        );

        return;

    }


    hideModalMessage();


    try {

        const token =
            getAccessToken();


        const response =
            await fetch(
                `${API_URL}${plantId}/`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const plant =
            await response.json();


        if (!response.ok) {

            throw new Error(
                plant.detail ||
                "Unable to load plant."
            );

        }


        document.getElementById(
            "plantModalTitle"
        ).textContent =
            "Edit Plant";


        document.getElementById(
            "plantId"
        ).value =
            plant.id;


        document.getElementById(
            "plantCode"
        ).value =
            plant.code || "";


        document.getElementById(
            "plantName"
        ).value =
            plant.name || "";


        document.getElementById(
            "plantActive"
        ).checked =
            Boolean(
                plant.active
            );


        document.getElementById(
            "savePlantButton"
        ).textContent =
            "Update Plant";


        plantModal.show();

    }

    catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* =========================================================
   SAVE PLANT
========================================================= */

async function savePlant() {

    if (!isAdmin) {

        showModalMessage(
            "Only Admins can add or edit plants.",
            "danger"
        );

        return;

    }


    hideModalMessage();


    const plantId =
        document.getElementById(
            "plantId"
        ).value;


    const code =
        document.getElementById(
            "plantCode"
        ).value.trim();


    const name =
        document.getElementById(
            "plantName"
        ).value.trim();


    const active =
        document.getElementById(
            "plantActive"
        ).checked;


    if (!code) {

        showModalMessage(
            "Plant code is required.",
            "danger"
        );

        return;

    }


    if (!name) {

        showModalMessage(
            "Plant name is required.",
            "danger"
        );

        return;

    }


    const token =
        getAccessToken();


    if (!token) {

        showModalMessage(
            "Authentication token not found.",
            "danger"
        );

        return;

    }


    const isEditing =
        Boolean(plantId);


    const url =
        isEditing
            ? `${API_URL}${plantId}/`
            : API_URL;


    const method =
        isEditing
            ? "PATCH"
            : "POST";


    try {

        const response =
            await fetch(
                url,
                {
                    method: method,

                    headers: {
                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        code: code,
                        name: name,
                        active: active
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            let errorMessage =
                "Unable to save plant.";


            if (data.detail) {

                errorMessage =
                    data.detail;

            }

            else if (data.code) {

                errorMessage =
                    `Code: ${data.code}`;

            }

            else if (data.name) {

                errorMessage =
                    `Name: ${data.name}`;

            }


            throw new Error(
                errorMessage
            );

        }


        plantModal.hide();


        showMessage(
            isEditing
                ? "Plant updated successfully."
                : "Plant added successfully.",
            "success"
        );


        await loadPlants();

    }

    catch (error) {

        console.error(
            "Save plant error:",
            error
        );


        showModalMessage(
            error.message,
            "danger"
        );

    }

}


/* =========================================================
   DELETE PLANT
========================================================= */

async function deletePlant(
    plantId,
    plantCode
) {

    if (!isAdmin) {

        showMessage(
            "Only Admins can delete plants.",
            "danger"
        );

        return;

    }


    const confirmed =
        window.confirm(
            `Are you sure you want to delete ${plantCode}?`
        );


    if (!confirmed) {

        return;

    }


    const token =
        getAccessToken();


    if (!token) {

        showMessage(
            "Authentication token not found.",
            "danger"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}${plantId}/`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            let errorMessage =
                "Unable to delete plant.";


            try {

                const data =
                    await response.json();


                if (data.detail) {

                    errorMessage =
                        data.detail;

                }

            }

            catch (error) {

                // Ignore JSON parsing error.

            }


            throw new Error(
                errorMessage
            );

        }


        showMessage(
            "Plant deleted successfully.",
            "success"
        );


        await loadPlants();

    }

    catch (error) {

        console.error(
            "Delete plant error:",
            error
        );


        showMessage(
            error.message,
            "danger"
        );

    }

}


/* =========================================================
   INITIALIZE PAGE
========================================================= */

function initialize() {

    /*
        Hide Admin-only controls for non-admin users.
    */

    if (!isAdmin) {

        addPlantButton.style.display =
            "none";


        actionsHeader.style.display =
            "none";

    }


    loadPlants();

}


initialize();


</script>

</body>

</html>
