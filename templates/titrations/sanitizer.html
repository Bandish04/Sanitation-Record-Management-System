<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sanitizer Titration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Sanitizer / Maxquat Titration
        </h2>

        <a
            href="/dashboard/"
            class="btn btn-secondary"
        >
            Dashboard
        </a>

    </div>


    <!-- CREATE / EDIT FORM -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h4 class="mb-4">
                New Titration
            </h4>


            <div
                id="message"
                class="alert d-none"
            ></div>


            <form id="titrationForm">

                <!-- PLANT -->

                <div class="mb-3">

                    <label
                        for="plant"
                        class="form-label"
                    >
                        Plant
                    </label>

                    <select
                        id="plant"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Plant
                        </option>

                    </select>

                </div>


                <!-- SAMPLE VOLUME -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Sample Volume
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="5 mL"
                        readonly
                    >

                </div>


                <!-- R-71 DROPS -->

                <div class="mb-3">

                    <label
                        for="r71_drops"
                        class="form-label"
                    >
                        R-71 Drops
                    </label>

                    <input
                        type="number"
                        id="r71_drops"
                        class="form-control"
                        min="1"
                        max="32"
                        required
                    >

                    <div class="form-text">
                        Enter a value from 1 to 32 drops.
                    </div>

                </div>


                <!-- CALCULATED VALUES -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            PPM
                        </label>

                        <input
                            type="text"
                            id="ppm"
                            class="form-control"
                            value="0.00"
                            readonly
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            % v/v
                        </label>

                        <input
                            type="text"
                            id="percent_vv"
                            class="form-control"
                            value="0.0000"
                            readonly
                        >

                    </div>

                </div>


                <!-- RESULT -->

                <div class="mb-4">

                    <label class="form-label">
                        Result
                    </label>

                    <div
                        id="resultStatus"
                        class="alert alert-secondary"
                    >
                        Enter R-71 drops to calculate.
                    </div>

                </div>


                <!-- BUTTONS -->

                <button
                    type="submit"
                    id="saveButton"
                    class="btn btn-primary"
                >
                    Save Draft
                </button>

                <button
                    type="button"
                    id="submitButton"
                    class="btn btn-success ms-2 d-none"
                >
                    Submit
                </button>

                <button
                    type="button"
                    id="cancelEditButton"
                    class="btn btn-secondary ms-2 d-none"
                >
                    Cancel Edit
                </button>

            </form>

        </div>

    </div>


    <!-- RECORDS -->

    <div class="card shadow">

        <div class="card-body">

            <h4 class="mb-4">
                Sanitizer Titration Records
            </h4>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Plant</th>
                            <th>R-71 Drops</th>
                            <th>PPM</th>
                            <th>% v/v</th>
                            <th>Result</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="recordsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "/api/titrations/";

const accessToken =
    localStorage.getItem("access_token");


let editingId = null;


/* --------------------------------------------------
   CHECK LOGIN
-------------------------------------------------- */

if (!accessToken) {

    window.location.href = "/login/";

}


/* --------------------------------------------------
   ELEMENTS
-------------------------------------------------- */

const form =
    document.getElementById("titrationForm");

const plantSelect =
    document.getElementById("plant");

const dropsInput =
    document.getElementById("r71_drops");

const ppmInput =
    document.getElementById("ppm");

const percentInput =
    document.getElementById("percent_vv");

const resultStatus =
    document.getElementById("resultStatus");

const saveButton =
    document.getElementById("saveButton");

const submitButton =
    document.getElementById("submitButton");

const cancelEditButton =
    document.getElementById("cancelEditButton");

const recordsTable =
    document.getElementById("recordsTable");

const message =
    document.getElementById("message");


/* --------------------------------------------------
   MESSAGE
-------------------------------------------------- */

function showMessage(text, type = "success") {

    message.textContent = text;

    message.className =
        `alert alert-${type}`;

}


/* --------------------------------------------------
   API HEADERS
-------------------------------------------------- */

function getHeaders() {

    return {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
    };

}


/* --------------------------------------------------
   LOAD PLANTS
-------------------------------------------------- */

async function loadPlants() {

    try {

        const response = await fetch(
            "/api/plants/",
            {
                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                "Unable to load plants."
            );

        }


        const plants =
            await response.json();


        plantSelect.innerHTML =
            '<option value="">Select Plant</option>';


        plants.forEach(plant => {

            if (!plant.active) {
                return;
            }

            const option =
                document.createElement("option");

            option.value =
                plant.id;

            option.textContent =
                `${plant.code} - ${plant.name}`;

            plantSelect.appendChild(option);

        });

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* --------------------------------------------------
   CALCULATE VALUES
-------------------------------------------------- */

function calculateValues() {

    const drops =
        Number(dropsInput.value);


    if (!drops || drops < 1) {

        ppmInput.value = "0.00";

        percentInput.value =
            "0.0000";

        resultStatus.textContent =
            "Enter R-71 drops to calculate.";

        resultStatus.className =
            "alert alert-secondary";

        return;

    }


    const ppm =
        drops * 12.5;


    const percentVV =
        drops * 0.0125;


    ppmInput.value =
        ppm.toFixed(2);


    percentInput.value =
        percentVV.toFixed(4);


    resultStatus.textContent =
        "Final PASS / FAIL status will be determined by the server.";

    resultStatus.className =
        "alert alert-info";

}


/* --------------------------------------------------
   DROPS INPUT
-------------------------------------------------- */

dropsInput.addEventListener(
    "input",
    calculateValues
);


/* --------------------------------------------------
   LOAD RECORDS
-------------------------------------------------- */

async function loadRecords() {

    try {

        const response = await fetch(
            API_URL,
            {
                headers: getHeaders()
            }
        );


        if (!response.ok) {

            throw new Error(
                "Unable to load titration records."
            );

        }


        const records =
            await response.json();


        recordsTable.innerHTML = "";


        if (records.length === 0) {

            recordsTable.innerHTML = `
                <tr>
                    <td
                        colspan="9"
                        class="text-center"
                    >
                        No sanitizer titration records found.
                    </td>
                </tr>
            `;

            return;

        }


        records.forEach(record => {

            const row =
                document.createElement("tr");


            let actions = "";


            if (record.status === "DRAFT") {

                actions = `
                    <button
                        class="btn btn-sm btn-primary me-1"
                        onclick="editRecord(${record.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="btn btn-sm btn-success"
                        onclick="submitRecord(${record.id})"
                    >
                        Submit
                    </button>
                `;

            } else {

                actions = `
                    <span class="text-muted">
                        Locked
                    </span>
                `;

            }


            row.innerHTML = `

                <td>${record.id}</td>

                <td>
                    ${record.plant}
                </td>

                <td>
                    ${record.r71_drops}
                </td>

                <td>
                    ${record.ppm}
                </td>

                <td>
                    ${record.percent_vv}
                </td>

                <td>
                    ${formatResultStatus(
                        record.result_status
                    )}
                </td>

                <td>
                    ${record.status}
                </td>

                <td>
                    ${formatDate(
                        record.created_at
                    )}
                </td>

                <td>
                    ${actions}
                </td>

            `;


            recordsTable.appendChild(row);

        });


    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* --------------------------------------------------
   RESULT STATUS DISPLAY
-------------------------------------------------- */

function formatResultStatus(status) {

    if (status === "PASS") {

        return `
            <span class="badge bg-success">
                PASS
            </span>
        `;

    }


    if (status === "FAIL") {

        return `
            <span class="badge bg-danger">
                FAIL
            </span>
        `;

    }


    if (status === "REVIEW_REQUIRED") {

        return `
            <span class="badge bg-warning text-dark">
                REVIEW REQUIRED
            </span>
        `;

    }


    return status;

}


/* --------------------------------------------------
   DATE FORMAT
-------------------------------------------------- */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }


    return new Date(
        dateString
    ).toLocaleString();

}


/* --------------------------------------------------
   SAVE DRAFT
-------------------------------------------------- */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const plant =
            plantSelect.value;

        const drops =
            Number(dropsInput.value);


        if (!plant) {

            showMessage(
                "Please select a plant.",
                "danger"
            );

            return;

        }


        if (!drops || drops < 1 || drops > 32) {

            showMessage(
                "R-71 drops must be between 1 and 32.",
                "danger"
            );

            return;

        }


        const payload = {
            plant: Number(plant),
            r71_drops: drops
        };


        saveButton.disabled = true;


        try {

            let response;


            if (editingId) {

                response = await fetch(
                    `${API_URL}${editingId}/`,
                    {
                        method: "PATCH",
                        headers: getHeaders(),
                        body: JSON.stringify(payload)
                    }
                );

            } else {

                response = await fetch(
                    API_URL,
                    {
                        method: "POST",
                        headers: getHeaders(),
                        body: JSON.stringify(payload)
                    }
                );

            }


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    JSON.stringify(data),
                    "danger"
                );

                return;

            }


            if (editingId) {

                showMessage(
                    "Sanitizer titration updated successfully.",
                    "success"
                );

            } else {

                showMessage(
                    "Sanitizer titration saved as draft.",
                    "success"
                );

            }


            editingId = null;

            resetForm();

            await loadRecords();


        } catch (error) {

            showMessage(
                "Unable to save titration.",
                "danger"
            );

        } finally {

            saveButton.disabled = false;

        }

    }
);


/* --------------------------------------------------
   EDIT RECORD
-------------------------------------------------- */

async function editRecord(id) {

    try {

        const response = await fetch(
            `${API_URL}${id}/`,
            {
                headers: getHeaders()
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                JSON.stringify(data),
                "danger"
            );

            return;

        }


        if (data.status !== "DRAFT") {

            showMessage(
                "Only draft titrations can be edited.",
                "danger"
            );

            return;

        }


        editingId = id;


        plantSelect.value =
            data.plant;

        dropsInput.value =
            data.r71_drops;


        calculateValues();


        saveButton.textContent =
            "Update Draft";

        submitButton.classList.remove(
            "d-none"
        );

        cancelEditButton.classList.remove(
            "d-none"
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        showMessage(
            "Unable to load titration.",
            "danger"
        );

    }

}


/* --------------------------------------------------
   SUBMIT RECORD
-------------------------------------------------- */

async function submitRecord(id) {

    const confirmed =
        confirm(
            "Are you sure you want to submit this titration? It cannot be edited after submission."
        );


    if (!confirmed) {
        return;
    }


    try {

        const response = await fetch(
            `${API_URL}${id}/submit/`,
            {
                method: "POST",
                headers: getHeaders()
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                JSON.stringify(data),
                "danger"
            );

            return;

        }


        showMessage(
            "Sanitizer titration submitted successfully.",
            "success"
        );


        await loadRecords();


    } catch (error) {

        showMessage(
            "Unable to submit titration.",
            "danger"
        );

    }

}


/* --------------------------------------------------
   CANCEL EDIT
-------------------------------------------------- */

cancelEditButton.addEventListener(
    "click",
    function() {

        editingId = null;

        resetForm();

    }
);


/* --------------------------------------------------
   RESET FORM
-------------------------------------------------- */

function resetForm() {

    form.reset();


    ppmInput.value =
        "0.00";

    percentInput.value =
        "0.0000";


    resultStatus.textContent =
        "Enter R-71 drops to calculate.";

    resultStatus.className =
        "alert alert-secondary";


    saveButton.textContent =
        "Save Draft";


    submitButton.classList.add(
        "d-none"
    );


    cancelEditButton.classList.add(
        "d-none"
    );

}


/* --------------------------------------------------
   INITIAL LOAD
-------------------------------------------------- */

loadPlants();

loadRecords();

</script>

</body>

</html>
