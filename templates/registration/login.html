<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Sanitation Record Management System
                    </h2>

                    <h4 class="text-center mb-4">
                        Login
                    </h4>

                    <div
                        id="errorMessage"
                        class="alert alert-danger d-none"
                    ></div>

                    <form
                        method="post"
                        id="loginForm"
                    >

                        {% csrf_token %}

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            id="loginButton"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const errorMessage =
    document.getElementById("errorMessage");

const loginButton =
    document.getElementById("loginButton");


loginForm.addEventListener(
    "submit",
    async function(event) {

        /*
         * Stop the normal form submission temporarily.
         *
         * First we authenticate against our REST API
         * and obtain the JWT access token.
         */
        event.preventDefault();

        const username =
            document.getElementById(
                "username"
            ).value;

        const password =
            document.getElementById(
                "password"
            ).value;


        errorMessage.classList.add("d-none");

        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {

            /*
             * Call our existing REST API login endpoint.
             */
            const response = await fetch(
                "/api/auth/login/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            const data =
                await response.json();


            /*
             * If the API rejected the credentials,
             * show the error and stop.
             */
            if (!response.ok) {

                let message =
                    "Invalid username or password.";

                if (data.detail) {
                    message = data.detail;
                }

                if (data.non_field_errors) {
                    message =
                        data.non_field_errors[0];
                }

                errorMessage.textContent =
                    message;

                errorMessage.classList.remove(
                    "d-none"
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

                return;
            }


            /*
             * Save the JWT tokens.
             *
             * IMPORTANT:
             * API requests use the ACCESS token.
             */
            localStorage.setItem(
                "access_token",
                data.tokens.access
            );

            localStorage.setItem(
                "refresh_token",
                data.tokens.refresh
            );


            /*
             * Now allow the normal Django form
             * submission to happen.
             *
             * This creates the Django browser session.
             */
            loginForm.submit();

        } catch (error) {

            errorMessage.textContent =
                "Unable to connect to the server.";

            errorMessage.classList.remove(
                "d-none"
            );

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>

</body>

</html>
