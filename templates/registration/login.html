<!DOCTYPE html>
<html>
<head>
    <title>Login - Sanitation System</title>
</head>

<body>

    <h1>Sanitation Record Management System</h1>

    <h2>Login</h2>

    {% if form.errors %}
        <p>Username or password is incorrect.</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'signup' %}">
            Sign Up
        </a>
    </p>

</body>
</html>
