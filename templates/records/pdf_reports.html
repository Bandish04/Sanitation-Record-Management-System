<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily PDF Report</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header">

                    <h3 class="mb-0">
                        Daily PDF Report
                    </h3>

                </div>


                <div class="card-body">

                    <!-- Plant -->

                    <div class="mb-4">

                        <label
                            for="plant"
                            class="form-label"
                        >
                            Plant
                        </label>

                        <select
                            id="plant"
                            class="form-select"
                        >

                            <option value="1">
                                PLANT_A - Plant A
                            </option>

                            <option value="2">
                                PLANT_B - Plant B
                            </option>

                        </select>

                    </div>


                    <!-- Date -->

                    <div class="mb-4">

                        <label
                            for="record-date"
                            class="form-label"
                        >
                            Date
                        </label>

                        <input
                            type="date"
                            id="record-date"
                            class="form-control"
                        >

                    </div>


                    <!-- Error -->

                    <div
                        id="error-message"
                        class="alert alert-danger d-none"
                    ></div>


                    <!-- Success -->

                    <div
                        id="success-message"
                        class="alert alert-success d-none"
                    >
                        PDF generated successfully.
                    </div>


                    <!-- Button -->

                    <button
                        type="button"
                        id="generate-pdf"
                        class="btn btn-primary w-100"
                    >
                        Generate PDF
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const plantSelect =
            document.getElementById("plant");

        const dateInput =
            document.getElementById("record-date");

        const generateButton =
            document.getElementById("generate-pdf");

        const errorMessage =
            document.getElementById("error-message");

        const successMessage =
            document.getElementById("success-message");


        // Set today's date

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(
                2,
                "0"
            );

        const day =
            String(
                today.getDate()
            ).padStart(
                2,
                "0"
            );

        dateInput.value =
            `${year}-${month}-${day}`;


        // Generate PDF

        generateButton.addEventListener(
            "click",
            generatePDF
        );


        async function generatePDF() {

            const plant =
                plantSelect.value;

            const date =
                dateInput.value;


            // Clear messages

            errorMessage.classList.add(
                "d-none"
            );

            successMessage.classList.add(
                "d-none"
            );


            // Validate date

            if (!date) {

                errorMessage.textContent =
                    "Please select a date.";

                errorMessage.classList.remove(
                    "d-none"
                );

                return;
            }


            // Get JWT token

            const token =
                localStorage.getItem(
                    "access_token"
                );


            if (!token) {

                errorMessage.textContent =
                    "You are not logged in. Please login first.";

                errorMessage.classList.remove(
                    "d-none"
                );

                return;
            }


            // Disable button

            generateButton.disabled =
                true;

            generateButton.textContent =
                "Generating PDF...";


            try {

                const response =
                    await fetch(
                        `/api/records/daily/pdf/?plant=${plant}&date=${date}`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                if (!response.ok) {

                    let errorText =
                        "Failed to generate PDF.";

                    try {

                        const errorData =
                            await response.json();

                        errorText =
                            errorData.detail ||
                            errorText;

                    } catch (error) {

                        // Response was not JSON

                    }

                    throw new Error(
                        errorText
                    );
                }


                // Convert response to Blob

                const blob =
                    await response.blob();


                // Create temporary URL

                const url =
                    window.URL.createObjectURL(
                        blob
                    );


                // Create download link

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    url;

                link.download =
                    `daily_records_${plant}_${date}.pdf`;


                document.body.appendChild(
                    link
                );

                link.click();


                // Clean up

                link.remove();

                window.URL.revokeObjectURL(
                    url
                );


                successMessage.classList.remove(
                    "d-none"
                );


            } catch (error) {

                errorMessage.textContent =
                    error.message;

                errorMessage.classList.remove(
                    "d-none"
                );

            } finally {

                generateButton.disabled =
                    false;

                generateButton.textContent =
                    "Generate PDF";

            }

        }

    }
);

</script>

</body>

</html>
