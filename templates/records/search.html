<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search Records</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">


    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="mb-1">
                Search Records
            </h1>

            <p class="text-muted mb-0">
                Search and view sanitation records.
            </p>

        </div>

        <a
            href="/dashboard/"
            class="btn btn-outline-secondary"
        >
            Dashboard
        </a>

    </div>


    <!-- SEARCH CARD -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <h5 class="mb-0">
                Search Filters
            </h5>

        </div>


        <div class="card-body">

            <div class="row g-3">


                <!-- PLANT -->
                <div class="col-md-3">

                    <label
                        for="plant"
                        class="form-label"
                    >
                        Plant
                    </label>

                    <select
                        id="plant"
                        class="form-select"
                    >

                        <option value="">
                            All Plants
                        </option>

                    </select>

                </div>


                <!-- START DATE -->
                <div class="col-md-2">

                    <label
                        for="startDate"
                        class="form-label"
                    >
                        Start Date
                    </label>

                    <input
                        type="date"
                        id="startDate"
                        class="form-control"
                    >

                </div>


                <!-- END DATE -->
                <div class="col-md-2">

                    <label
                        for="endDate"
                        class="form-label"
                    >
                        End Date
                    </label>

                    <input
                        type="date"
                        id="endDate"
                        class="form-control"
                    >

                </div>


                <!-- RECORD TYPE -->
                <div class="col-md-2">

                    <label
                        for="recordType"
                        class="form-label"
                    >
                        Record Type
                    </label>

                    <select
                        id="recordType"
                        class="form-select"
                    >

                        <option value="">
                            All Types
                        </option>

                        <option value="sanitizer">
                            Sanitizer / Maxquat
                        </option>

                        <option value="chloragel">
                            Chloragel
                        </option>

                        <option value="inspection">
                            Inspection
                        </option>

                        <option value="atp">
                            ATP Report
                        </option>

                    </select>

                </div>


                <!-- STATUS -->
                <div class="col-md-2">

                    <label
                        for="status"
                        class="form-label"
                    >
                        Status
                    </label>

                    <select
                        id="status"
                        class="form-select"
                    >

                        <option value="">
                            All Statuses
                        </option>

                        <option value="DRAFT">
                            DRAFT
                        </option>

                        <option value="SUBMITTED">
                            SUBMITTED
                        </option>

                        <option value="CORRECTED">
                            CORRECTED
                        </option>

                        <option value="REVIEW_REQUIRED">
                            REVIEW_REQUIRED
                        </option>

                        <option value="PASS">
                            PASS
                        </option>

                        <option value="FAIL">
                            FAIL
                        </option>

                    </select>

                </div>


                <!-- SEARCH BUTTON -->
                <div class="col-md-1 d-flex align-items-end">

                    <button
                        type="button"
                        id="searchButton"
                        class="btn btn-primary w-100"
                        onclick="loadRecords()"
                    >
                        Search
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- MESSAGE -->
    <div
        id="message"
        class="alert d-none"
    ></div>


    <!-- RESULTS CARD -->
    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between align-items-center">

            <h5 class="mb-0">
                Search Results
            </h5>

            <span
                id="resultCount"
                class="badge bg-secondary"
            >
                0
            </span>

        </div>


        <div class="card-body p-0">


            <div class="table-responsive">


                <table class="table table-hover table-bordered mb-0">


                    <thead class="table-light">

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                Plant
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Created By
                            </th>

                            <th>
                                Created At
                            </th>

                            <th>
                                Details
                            </th>

                        </tr>

                    </thead>


                    <tbody id="resultsBody">

                        <tr>

                            <td
                                colspan="8"
                                class="text-center text-muted py-4"
                            >
                                No records loaded.
                            </td>

                        </tr>

                    </tbody>


                </table>


            </div>


        </div>

    </div>


</div>


<!-- DETAILS MODAL -->
<div
    class="modal fade"
    id="detailsModal"
    tabindex="-1"
    aria-labelledby="detailsModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="detailsModalLabel"
                >
                    Record Details
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <div class="modal-body">

                <div id="detailsContent"></div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Close
                </button>

            </div>


        </div>

    </div>

</div>


<!-- BOOTSTRAP -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script>


/* =========================================================
   GLOBAL ELEMENTS
========================================================= */

const plantSelect =
    document.getElementById("plant");

const startDate =
    document.getElementById("startDate");

const endDate =
    document.getElementById("endDate");

const recordType =
    document.getElementById("recordType");

const statusSelect =
    document.getElementById("status");

const resultsBody =
    document.getElementById("resultsBody");

const resultCount =
    document.getElementById("resultCount");

const message =
    document.getElementById("message");

const detailsContent =
    document.getElementById("detailsContent");


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    return (
        localStorage.getItem("access_token") ||
        localStorage.getItem("access")
    );

}       


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "danger") {

    message.className =
        `alert alert-${type}`;

    message.textContent =
        text;

}


function hideMessage() {

    message.className =
        "alert d-none";

    message.textContent =
        "";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   STATUS BADGE
========================================================= */

function getStatusBadge(status) {

    if (
        status === null ||
        status === undefined ||
        status === ""
    ) {

        return `
            <span class="badge bg-secondary">
                -
            </span>
        `;

    }


    let badgeClass =
        "bg-secondary";


    const normalized =
        String(status).toUpperCase();


    if (
        normalized === "PASS" ||
        normalized === "SUBMITTED" ||
        normalized === "COMPLETED"
    ) {

        badgeClass =
            "bg-success";

    }

    else if (
        normalized === "FAIL" ||
        normalized === "CANCELLED"
    ) {

        badgeClass =
            "bg-danger";

    }

    else if (
        normalized === "DRAFT" ||
        normalized === "IN_PROGRESS"
    ) {

        badgeClass =
            "bg-warning text-dark";

    }

    else if (
        normalized === "REVIEW_REQUIRED" ||
        normalized === "CORRECTED"
    ) {

        badgeClass =
            "bg-info text-dark";

    }


    return `
        <span class="badge ${badgeClass}">
            ${escapeHtml(status)}
        </span>
    `;

}


/* =========================================================
   ANSWER BADGE
========================================================= */

function getAnswerBadge(answer) {

    if (
        answer === null ||
        answer === undefined ||
        answer === ""
    ) {

        return `
            <span class="badge bg-secondary">
                -
            </span>
        `;

    }


    const normalized =
        String(answer).toUpperCase();


    if (normalized === "YES") {

        return `
            <span class="badge bg-success">
                YES
            </span>
        `;

    }


    if (normalized === "NO") {

        return `
            <span class="badge bg-danger">
                NO
            </span>
        `;

    }


    if (
        normalized === "NA" ||
        normalized === "N/A"
    ) {

        return `
            <span class="badge bg-secondary">
                N/A
            </span>
        `;

    }


    return escapeHtml(answer);

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value) {

    if (!value) {

        return "-";

    }


    try {

        const date =
            new Date(value);


        if (isNaN(date.getTime())) {

            return escapeHtml(value);

        }


        return date.toLocaleString();

    }

    catch (error) {

        return escapeHtml(value);

    }

}


/* =========================================================
   LOAD PLANTS
========================================================= */

async function loadPlants() {

    try {

        const token =
            getToken();


        const headers = {};


        if (token) {

            headers["Authorization"] =
                `Bearer ${token}`;

        }


        const response =
            await fetch(
                "/api/plants/",
                {
                    method: "GET",
                    headers: headers
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load plants."
            );

        }


        const data =
            await response.json();


        plantSelect.innerHTML = `

            <option value="">
                All Plants
            </option>

        `;


        let plants = [];


        if (Array.isArray(data)) {

            plants = data;

        }

        else if (
            data &&
            Array.isArray(data.results)
        ) {

            plants = data.results;

        }


        plants.forEach(
            function(plant) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    plant.id;


                option.textContent =
                    `${plant.code || ""} - ${plant.name || ""}`;


                plantSelect.appendChild(
                    option
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Plant loading error:",
            error
        );

        showMessage(
            error.message,
            "danger"
        );

    }

}


/* =========================================================
   LOAD RECORDS
========================================================= */

async function loadRecords() {

    hideMessage();


    resultsBody.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="text-center py-4"
            >

                <div
                    class="spinner-border text-primary"
                    role="status"
                ></div>

                <div class="mt-2">
                    Loading records...
                </div>

            </td>

        </tr>

    `;


    const params =
        new URLSearchParams();


    if (plantSelect.value) {

        params.append(
            "plant",
            plantSelect.value
        );

    }


    if (startDate.value) {

        params.append(
            "start_date",
            startDate.value
        );

    }


    if (endDate.value) {

        params.append(
            "end_date",
            endDate.value
        );

    }


    if (recordType.value) {

        params.append(
            "record_type",
            recordType.value
        );

    }


    if (statusSelect.value) {

        params.append(
            "status",
            statusSelect.value
        );

    }


    try {

        const token =
            getToken();


        const headers = {};


        if (token) {

            headers["Authorization"] =
                `Bearer ${token}`;

        }


        const url =
            `/api/records/?${params.toString()}`;


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: headers
                }
            );


        if (!response.ok) {

            let errorMessage =
                "Unable to load records.";


            try {

                const errorData =
                    await response.json();


                if (errorData.detail) {

                    errorMessage =
                        errorData.detail;

                }

            }

            catch (error) {

                // Ignore JSON parsing error.

            }


            throw new Error(
                errorMessage
            );

        }


        const data =
            await response.json();


        let records = [];


        if (Array.isArray(data)) {

            records =
                data;

        }

        else if (
            data &&
            Array.isArray(data.results)
        ) {

            records =
                data.results;

        }

        else if (
            data &&
            Array.isArray(data.records)
        ) {

            records =
                data.records;

        }


        renderRecords(
            records
        );


    }

    catch (error) {

        console.error(
            "Record loading error:",
            error
        );


        resultsBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="text-center text-danger py-4"
                >
                    ${escapeHtml(error.message)}
                </td>

            </tr>

        `;


        resultCount.textContent =
            "0";


        showMessage(
            error.message,
            "danger"
        );

    }

}


/* =========================================================
   RENDER RECORDS
========================================================= */

function renderRecords(records) {

    resultCount.textContent =
        records.length;


    if (
        !records ||
        records.length === 0
    ) {

        resultsBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="text-center text-muted py-4"
                >
                    No records found.
                </td>

            </tr>

        `;

        return;

    }


    resultsBody.innerHTML =
        "";


    records.forEach(
        function(record) {

            const row =
                document.createElement(
                    "tr"
                );


            const plantDisplay =
                record.plant_name
                    ? `${record.plant_code || ""} - ${record.plant_name}`
                    : (
                        record.plant_code ||
                        "-"
                    );


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        record.id ?? "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        getRecordTypeLabel(
                            record.record_type
                        )
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        plantDisplay
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        record.date || "-"
                    )}
                </td>

                <td>
                    ${getStatusBadge(
                        record.status
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        record.created_by_username ||
                        "-"
                    )}
                </td>

                <td>
                    ${formatDate(
                        record.created_at
                    )}
                </td>

                <td>

                    <button
                        type="button"
                        class="btn btn-sm btn-outline-primary"
                    >
                        View
                    </button>

                </td>

            `;


            const viewButton =
                row.querySelector(
                    "button"
                );


            viewButton.addEventListener(
                "click",
                function() {

                    showDetails(
                        record
                    );

                }
            );


            resultsBody.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   RECORD TYPE LABEL
========================================================= */

function getRecordTypeLabel(type) {

    const labels = {

        sanitizer:
            "Sanitizer / Maxquat",

        chloragel:
            "Chloragel",

        inspection:
            "Sanitation Inspection",

        atp:
            "ATP Report"

    };


    return labels[type] ||
        type ||
        "-";

}


/* =========================================================
   SHOW RECORD DETAILS
========================================================= */

function showDetails(record) {

    const modalElement =
        document.getElementById(
            "detailsModal"
        );


    const modal =
        bootstrap.Modal.getOrCreateInstance(
            modalElement
        );


    const data =
        record.data || {};


    let html = `

        <!-- COMMON INFORMATION -->

        <div class="row g-3 mb-4">


            <div class="col-md-4">

                <div class="border rounded p-3 h-100">

                    <small class="text-muted">
                        Record ID
                    </small>

                    <div class="fw-bold fs-5">

                        ${escapeHtml(
                            record.id ?? "-"
                        )}

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="border rounded p-3 h-100">

                    <small class="text-muted">
                        Record Type
                    </small>

                    <div class="fw-bold">

                        ${escapeHtml(
                            getRecordTypeLabel(
                                record.record_type
                            )
                        )}

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="border rounded p-3 h-100">

                    <small class="text-muted">
                        Plant
                    </small>

                    <div class="fw-bold">

                        ${escapeHtml(
                            record.plant_code
                                ? `${record.plant_code} - ${record.plant_name || ""}`
                                : (
                                    record.plant_name ||
                                    "-"
                                )
                        )}

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="border rounded p-3 h-100">

                    <small class="text-muted">
                        Date
                    </small>

                    <div class="fw-bold">

                        ${escapeHtml(
                            record.date || "-"
                        )}

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="border rounded p-3 h-100">

                    <small class="text-muted">
                        Status
                    </small>

                    <div class="mt-1">

                        ${getStatusBadge(
                            record.status
                        )}

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="border rounded p-3 h-100">

                    <small class="text-muted">
                        Created By
                    </small>

                    <div class="fw-bold">

                        ${escapeHtml(
                            record.created_by_username ||
                            "-"
                        )}

                    </div>

                </div>

            </div>


        </div>

    `;


    /* =====================================================
       SANITIZER / MAXQUAT
    ===================================================== */

    if (
        record.record_type === "sanitizer"
    ) {

        html += `

            <h5 class="mb-3">
                Sanitizer / Maxquat Titration
            </h5>


            <div class="table-responsive">

                <table class="table table-bordered">

                    <tbody>


                        <tr>

                            <th
                                style="width:40%;"
                            >
                                R-71 Drops
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.r71_drops ?? "-"
                                )}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Sample Volume
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.sample_volume_ml ?? "-"
                                )}

                                mL

                            </td>

                        </tr>


                        <tr>

                            <th>
                                PPM
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.ppm ?? "-"
                                )}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Percent V/V
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.percent_vv ?? "-"
                                )}

                                %

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Result
                            </th>

                            <td>

                                ${getStatusBadge(
                                    data.result_status ||
                                    record.status
                                )}

                            </td>

                        </tr>


                    </tbody>

                </table>

            </div>

        `;

    }


    /* =====================================================
       CHLORAGEL
    ===================================================== */

    else if (
        record.record_type === "chloragel"
    ) {

        html += `

            <h5 class="mb-3">
                Chloragel Titration
            </h5>


            <div class="table-responsive">

                <table class="table table-bordered">

                    <tbody>


                        <tr>

                            <th
                                style="width:40%;"
                            >
                                R-9 Drops
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.r9_drops ?? "-"
                                )}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Sample Volume
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.sample_volume_ml ?? "-"
                                )}

                                mL

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Result %
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.result_percent ?? "-"
                                )}

                                %

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Result
                            </th>

                            <td>

                                ${getStatusBadge(
                                    data.result_status ||
                                    record.status
                                )}

                            </td>

                        </tr>


                    </tbody>

                </table>

            </div>

        `;

    }


    /* =====================================================
       SANITATION INSPECTION
    ===================================================== */

    else if (
        record.record_type === "inspection"
    ) {

        const answers =
            Array.isArray(
                data.answers
            )
                ? data.answers
                : [];


        html += `

            <h5 class="mb-3">
                Sanitation Inspection
            </h5>


            <div class="row g-3 mb-4">


                <div class="col-md-6">

                    <div class="border rounded p-3 h-100">

                        <small class="text-muted">
                            Inspection Template
                        </small>

                        <div class="fw-bold">

                            ${escapeHtml(
                                data.template_name ||
                                data.template ||
                                "Daily Sanitation Inspection"
                            )}

                        </div>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="border rounded p-3 h-100">

                        <small class="text-muted">
                            Inspection Date
                        </small>

                        <div class="fw-bold">

                            ${escapeHtml(
                                data.inspection_date ||
                                record.date ||
                                "-"
                            )}

                        </div>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="border rounded p-3 h-100">

                        <small class="text-muted">
                            Inspector
                        </small>

                        <div class="fw-bold">

                            ${escapeHtml(
                                data.inspector_name ||
                                data.inspector ||
                                record.created_by_username ||
                                "-"
                            )}

                        </div>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="border rounded p-3 h-100">

                        <small class="text-muted">
                            Signed At
                        </small>

                        <div class="fw-bold">

                            ${formatDate(
                                data.signed_at
                            )}

                        </div>

                    </div>

                </div>


            </div>


            <h5 class="mb-3">
                General Notes
            </h5>


            <div class="border rounded p-3 bg-light mb-4">

                ${escapeHtml(
                    data.general_notes ||
                    "No general notes."
                )}

            </div>


            <h5 class="mb-3">
                Inspection Answers
            </h5>

        `;


        if (
            answers.length === 0
        ) {

            html += `

                <div class="alert alert-info">

                    No inspection answers found.

                </div>

            `;

        }

        else {

            html += `

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    #
                                </th>

                                <th>
                                    Question
                                </th>

                                <th>
                                    Answer
                                </th>

                                <th>
                                    Observation
                                </th>

                            </tr>

                        </thead>


                        <tbody>

            `;


            answers.forEach(
                function(answer, index) {

                    html += `

                        <tr>

                            <td>
                                ${index + 1}
                            </td>

                            <td>

                                ${escapeHtml(
                                    answer.question ||
                                    "-"
                                )}

                            </td>

                            <td>

                                ${getAnswerBadge(
                                    answer.answer
                                )}

                            </td>

                            <td>

                                ${escapeHtml(
                                    answer.observation ||
                                    "-"
                                )}

                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                        </tbody>

                    </table>

                </div>

            `;

        }

    }


    /* =====================================================
       ATP REPORT
    ===================================================== */

    else if (
        record.record_type === "atp"
    ) {

        html += `

            <h5 class="mb-3">
                ATP Report
            </h5>


            <div class="table-responsive">

                <table class="table table-bordered">

                    <tbody>


                        <tr>

                            <th
                                style="width:40%;"
                            >
                                Original Filename
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.original_filename ||
                                    "-"
                                )}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Inspection
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.inspection ||
                                    "-"
                                )}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Notes
                            </th>

                            <td>

                                ${escapeHtml(
                                    data.notes ||
                                    "-"
                                )}

                            </td>

                        </tr>


                    </tbody>

                </table>

            </div>

        `;

    }


    /* =====================================================
       UNKNOWN RECORD TYPE
    ===================================================== */

    else {

        html += `

            <div class="alert alert-warning">

                No formatted details are available
                for this record type.

            </div>

        `;

    }


    detailsContent.innerHTML =
        html;


    modal.show();

}


/* =========================================================
   INITIALIZE PAGE
========================================================= */

async function initialize() {

    await loadPlants();

    await loadRecords();

}


initialize();


</script>


</body>
