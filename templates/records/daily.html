<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Combined Records</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
```

</head>

<body>

<div class="container mt-4">

```
<h2 class="mb-4">Daily Combined Records</h2>

<!-- Filters -->
<div class="card mb-4">

    <div class="card-body">

        <div class="row">

            <!-- Plant -->
            <div class="col-md-5">

                <label
                    for="plant"
                    class="form-label"
                >
                    Plant
                </label>

                <select
                    id="plant"
                    class="form-select"
                >

                    <option value="1">
                        PLANT_A - Plant A
                    </option>

                    <option value="2">
                        PLANT_B - Plant B
                    </option>

                </select>

            </div>


            <!-- Date -->
            <div class="col-md-5">

                <label
                    for="record-date"
                    class="form-label"
                >
                    Date
                </label>

                <input
                    type="date"
                    id="record-date"
                    class="form-control"
                >

            </div>


            <!-- Button -->
            <div class="col-md-2 d-flex align-items-end">

                <button
                    type="button"
                    id="load-records"
                    class="btn btn-primary w-100"
                >
                    Load Daily Records
                </button>

            </div>

        </div>

    </div>

</div>


<!-- Loading -->
<div
    id="loading"
    class="alert alert-info d-none"
>
    Loading daily records...
</div>


<!-- Error -->
<div
    id="error-message"
    class="alert alert-danger d-none"
></div>


<!-- Records -->
<div
    id="records-container"
    class="d-none"
>

    <div class="mb-4">

        <h4 id="daily-title"></h4>

    </div>


    <!-- Sanitizer -->
    <div class="card mb-4">

        <div class="card-header">

            <h5 class="mb-0">
                🧪 Sanitizer Titrations
            </h5>

        </div>

        <div class="card-body">

            <div id="sanitizer-records"></div>

        </div>

    </div>


    <!-- Chloragel -->
    <div class="card mb-4">

        <div class="card-header">

            <h5 class="mb-0">
                🧪 Chloragel Titrations
            </h5>

        </div>

        <div class="card-body">

            <div id="chloragel-records"></div>

        </div>

    </div>


    <!-- Inspections -->
    <div class="card mb-4">

        <div class="card-header">

            <h5 class="mb-0">
                📋 Sanitation Inspections
            </h5>

        </div>

        <div class="card-body">

            <div id="inspection-records"></div>

        </div>

    </div>


    <!-- ATP -->
    <div class="card mb-4">

        <div class="card-header">

            <h5 class="mb-0">
                🧫 ATP Reports
            </h5>

        </div>

        <div class="card-body">

            <div id="atp-records"></div>

        </div>

    </div>

</div>
```

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const plantSelect =
        document.getElementById("plant");

    const dateInput =
        document.getElementById("record-date");

    const loadButton =
        document.getElementById("load-records");

    const loading =
        document.getElementById("loading");

    const errorMessage =
        document.getElementById("error-message");

    const recordsContainer =
        document.getElementById("records-container");

    const dailyTitle =
        document.getElementById("daily-title");

    const sanitizerRecords =
        document.getElementById("sanitizer-records");

    const chloragelRecords =
        document.getElementById("chloragel-records");

    const inspectionRecords =
        document.getElementById("inspection-records");

    const atpRecords =
        document.getElementById("atp-records");


    // Set today's date
    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(today.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(today.getDate())
        .padStart(2, "0");

    dateInput.value =
        `${year}-${month}-${day}`;


    loadButton.addEventListener(
        "click",
        loadDailyRecords
    );


    async function loadDailyRecords() {

        const plant =
            plantSelect.value;

        const date =
            dateInput.value;


        if (!date) {

            errorMessage.textContent =
                "Please select a date.";

            errorMessage.classList.remove(
                "d-none"
            );

            return;
        }


        loading.classList.remove(
            "d-none"
        );

        errorMessage.classList.add(
            "d-none"
        );

        recordsContainer.classList.add(
            "d-none"
        );


        const token =
            localStorage.getItem(
                "access_token"
            );


        if (!token) {

            errorMessage.textContent =
                "You are not logged in. Please login first.";

            errorMessage.classList.remove(
                "d-none"
            );

            loading.classList.add(
                "d-none"
            );

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/records/daily/?plant=${plant}&date=${date}`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Failed to load daily records."
                );

            }


            displayDailyRecords(data);


        } catch (error) {

            errorMessage.textContent =
                error.message;

            errorMessage.classList.remove(
                "d-none"
            );


        } finally {

            loading.classList.add(
                "d-none"
            );

        }

    }


    function displayDailyRecords(data) {

        recordsContainer.classList.remove(
            "d-none"
        );


        dailyTitle.textContent =
            `${data.plant_code} - ${data.plant_name} | ${data.date}`;


        displaySanitizerRecords(
            data.sanitizer_titrations || []
        );


        displayChloragelRecords(
            data.chloragel_titrations || []
        );


        displayInspectionRecords(
            data.inspections || []
        );


        displayATPRecords(
            data.atp_reports || []
        );

    }


    function displaySanitizerRecords(records) {

        if (records.length === 0) {

            sanitizerRecords.innerHTML =
                `<p class="text-muted">
                    No sanitizer titrations found.
                </p>`;

            return;
        }


        let html = `

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>R-71 Drops</th>
                            <th>Sample Volume (ml)</th>
                            <th>PPM</th>
                            <th>% v/v</th>
                            <th>Status</th>
                            <th>Created By</th>
                            <th>Created At</th>
                        </tr>

                    </thead>

                    <tbody>

        `;


        records.forEach(record => {

            html += `

                <tr>

                    <td>${record.id}</td>

                    <td>${record.r71_drops}</td>

                    <td>${record.sample_volume_ml}</td>

                    <td>${record.ppm}</td>

                    <td>${record.percent_vv}</td>

                    <td>${record.status}</td>

                    <td>${record.created_by}</td>

                    <td>${formatDate(record.created_at)}</td>

                </tr>

            `;

        });


        html += `

                    </tbody>

                </table>

            </div>

        `;


        sanitizerRecords.innerHTML =
            html;

    }


    function displayChloragelRecords(records) {

        if (records.length === 0) {

            chloragelRecords.innerHTML =
                `<p class="text-muted">
                    No Chloragel titrations found.
                </p>`;

            return;
        }


        let html = `

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>R-9 Drops</th>
                            <th>Sample Volume (ml)</th>
                            <th>Result %</th>
                            <th>Status</th>
                            <th>Created By</th>
                            <th>Created At</th>
                        </tr>

                    </thead>

                    <tbody>

        `;


        records.forEach(record => {

            html += `

                <tr>

                    <td>${record.id}</td>

                    <td>${record.r9_drops}</td>

                    <td>${record.sample_volume_ml}</td>

                    <td>${record.result_percent}</td>

                    <td>${record.status}</td>

                    <td>${record.created_by}</td>

                    <td>${formatDate(record.created_at)}</td>

                </tr>

            `;

        });


        html += `

                    </tbody>

                </table>

            </div>

        `;


        chloragelRecords.innerHTML =
            html;

    }


    function displayInspectionRecords(records) {

        if (records.length === 0) {

            inspectionRecords.innerHTML =
                `<p class="text-muted">
                    No sanitation inspections found.
                </p>`;

            return;
        }


        let html = `

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Status</th>
                            <th>Created By</th>
                            <th>Created At</th>
                        </tr>

                    </thead>

                    <tbody>

        `;


        records.forEach(record => {

            html += `

                <tr>

                    <td>${record.id}</td>

                    <td>${record.status || ""}</td>

                    <td>${record.created_by || ""}</td>

                    <td>${formatDate(record.created_at)}</td>

                </tr>

            `;

        });


        html += `

                    </tbody>

                </table>

            </div>

        `;


        inspectionRecords.innerHTML =
            html;

    }


    function displayATPRecords(records) {

        if (records.length === 0) {

            atpRecords.innerHTML =
                `<p class="text-muted">
                    No ATP reports found.
                </p>`;

            return;
        }


        let html = `

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Filename</th>
                            <th>Inspection</th>
                            <th>Uploaded By</th>
                            <th>Uploaded At</th>
                            <th>Status</th>
                            <th>Notes</th>
                        </tr>

                    </thead>

                    <tbody>

        `;


        records.forEach(record => {

            html += `

                <tr>

                    <td>${record.id}</td>

                    <td>${record.original_filename}</td>

                    <td>${record.inspection}</td>

                    <td>${record.uploaded_by}</td>

                    <td>${formatDate(record.uploaded_at)}</td>

                    <td>${record.status}</td>

                    <td>

                        ${
                            record.notes
                            ? `<a
                                href="${record.notes}"
                                target="_blank"
                              >
                                View
                              </a>`
                            : ""
                        }

                    </td>

                </tr>

            `;

        });


        html += `

                    </tbody>

                </table>

            </div>

        `;


        atpRecords.innerHTML =
            html;

    }


    function formatDate(dateString) {

        if (!dateString) {
            return "";
        }

        return new Date(
            dateString
        ).toLocaleString();

    }

});

</script>

</body>

</html>
