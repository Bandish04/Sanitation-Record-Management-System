</div>

<script>


/*
 * Return a Bootstrap badge
 * based on the corrective action status.
 */

function getStatusBadge(status) {

    let badgeClass = "bg-secondary";


    if (status === "OPEN") {

        badgeClass = "bg-danger";

    }


    else if (status === "IN_PROGRESS") {

        badgeClass = "bg-warning text-dark";

    }


    else if (status === "COMPLETED") {

        badgeClass = "bg-success";

    }


    else if (status === "CANCELLED") {

        badgeClass = "bg-dark";

    }


    return `
        <span class="badge ${badgeClass}">
            ${status}
        </span>
    `;

}



/*
 * Load corrective actions from the API.
 */

async function loadCorrectiveActions() {


    const tableBody =
        document.getElementById(
            "correctiveActionsTableBody"
        );


    const message =
        document.getElementById(
            "message"
        );


    const statusFilter =
        document.getElementById(
            "statusFilter"
        ).value;


    /*
     * Show loading message.
     */

    tableBody.innerHTML = `
        <tr>

            <td
                colspan="10"
                class="text-center"
            >
                Loading...
            </td>

        </tr>
    `;


    message.innerHTML = "";


    try {


        /*
         * Get JWT access token.
         */

        const accessToken =
            localStorage.getItem(
                "access_token"
            );


        if (!accessToken) {

            throw new Error(
                "Authentication token not found. Please log in again."
            );

        }


        /*
         * Build API URL.
         */

        let apiUrl =
            "/api/corrective-actions/";


        /*
         * Add status filter if selected.
         */

        if (statusFilter) {

            apiUrl +=
                `?status=${statusFilter}`;

        }


        /*
         * Call API.
         */

        const response =
            await fetch(
                apiUrl,
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${accessToken}`

                    }

                }
            );


        /*
         * Handle API errors.
         */

        if (!response.ok) {

            if (response.status === 401) {

                throw new Error(
                    "Your session has expired. Please log in again."
                );

            }


            if (response.status === 403) {

                throw new Error(
                    "You do not have permission to view corrective actions."
                );

            }


            throw new Error(
                "Failed to load corrective actions."
            );

        }


        /*
         * Convert response to JSON.
         */

        const data =
            await response.json();


        /*
         * Clear existing table rows.
         */

        tableBody.innerHTML = "";


        /*
         * Handle empty results.
         */

        if (data.length === 0) {

            tableBody.innerHTML = `
                <tr>

                    <td
                        colspan="10"
                        class="text-center text-muted"
                    >
                        No corrective actions found.
                    </td>

                </tr>
            `;

            return;

        }


        /*
         * Display each corrective action.
         */

        data.forEach(
            action => {


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${action.id}
                    </td>


                    <td>
                        ${action.inspection}
                    </td>


                    <td>
                        ${action.question}
                    </td>


                    <td>
                        ${action.observation || ""}
                    </td>


                    <td>
                        ${action.action_required || ""}
                    </td>


                    <td>
                        ${
                            action.assigned_to ||
                            "Not assigned"
                        }
                    </td>


                    <td>
                        ${
                            action.due_date ||
                            "No due date"
                        }
                    </td>


                    <td>
                        ${action.action_taken || ""}
                    </td>


                    <td>
                        ${getStatusBadge(
                            action.status
                        )}
                    </td>


                    <td>
                        ${action.created_by}
                    </td>

                `;


                tableBody.appendChild(
                    row
                );

            }
        );


    }


    catch (error) {


        /*
         * Show error in table.
         */

        tableBody.innerHTML = `
            <tr>

                <td
                    colspan="10"
                    class="text-center text-danger"
                >
                    Unable to load corrective actions.
                </td>

            </tr>
        `;


        /*
         * Show detailed error message.
         */

        message.innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }

}



/*
 * Reload records whenever
 * the status filter changes.
 */

document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        loadCorrectiveActions
    );



/*
 * Load records when the page opens.
 */

loadCorrectiveActions();


</script>

</body>

</html>
